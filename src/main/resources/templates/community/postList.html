<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{community/fragments/head :: commHead(pageTitle='커뮤니티')}"></th:block>
    <!-- 후에 제거할 meta들 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" th:href="@{/css/community/post-list.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='community')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'community'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: ${#authorization.expression('hasRole(''ADMIN'')')} ? 'communityAdmin' : 'community'}"></div>
        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">
            <main class="container">
                <div th:replace="~{community/fragments/boardListHeader :: boardListHeader(boards=${boards}, boardId=${boardId}, loginUser=${loginUser})}"></div>
                <div th:replace="~{community/fragments/categoryBanner :: categoryBanner(board=${board}, categories=${categories}, categoryId=${categoryId})}"></div>

                <div class="tag-filter-wrapper" th:if="${boardTags != null and !boardTags.isEmpty()}">
                    <div class="tag-filter-inner">
                        <span class="tag-icon"><i class="fa-solid fa-tags"></i></span>
                        <div th:replace="~{community/fragments/postTag :: tagList(tags=${boardTags}, boardCode=${currentBoardCode})}"></div>
                    </div>
                </div>

                <div class="content-container">

                    <div class="list-top-area flex-between mt-md">
                        <div class="search-info-box">
                            <div th:if="${not #strings.isEmpty(keyword)}" class="search-status text-muted">
                                '<span th:text="${keyword}" class="search-keyword"></span>' 검색 결과
                                <span th:text="${page.totalElements}" class="search-count-pill">0</span>건
                            </div>
                        </div>

                        <div class="search-area">
                            <form th:action="@{|/community/${boardCode}/${categoryCode}|}" method="get" class="search-form flex">
                                <div class="select-wrapper">
                                    <select name="searchType" class="search-select text-small">
                                        <option value="title" th:selected="${searchType == 'title'}">제목</option>
                                        <option value="tc" th:selected="${searchType == 'tc'}">제목+내용</option>
                                        <option value="nickname" th:selected="${searchType == 'nickname'}">작성자</option>
                                    </select>
                                </div>

                                <div class="search-input-container">
                                    <input type="text" name="keyword" th:value="${keyword}"
                                           placeholder="2자 이상 입력하세요." class="search-input text-small">
                                    <button type="submit" class="btn-search-submit">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </button>
                                    <a th:href="@{|/community/${boardCode}/${categoryCode}|}" class="btn-reset-icon" title="검색 초기화">
                                        <i class="fa-solid fa-rotate-right"></i>
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="page-body mt-md">
                        <table class="table post-table">
                            <thead>
                                <tr>
                                    <th>카테고리</th>
                                    <th>제목</th>
                                    <th>조회수</th>
                                    <th>작성자</th>
                                    <th>작성일</th>
                                </tr>
                            </thead>
                            <tbody th:if="${not #lists.isEmpty(posts)}">
                                <tr th:each="post : ${posts}" th:classappend="${post.pinned} ? 'pinned' : ''">
                                    <td class="text-center">
                                        <span th:if="${post.categoryName != null}"
                                              th:text="${post.categoryName}"
                                              class="category-badge"
                                              th:classappend="${post.categoryCode}"
                                              th:style="${post.categoryBgColor != null} ?
                                                        'background-color:' + ${post.categoryBgColor} + '; color:' + ${post.categoryTextColor} + ';' : ''">
                                            카테고리
                                        </span>
                                    </td>
                                    <td class="title-cell">
                                        <!-- 나눔 -->
                                        <th:block th:if="${post.marketStatus != null and post.marketStatus != ''}">
                                            <span th:classappend="${'badge-' + post.marketStatus.toLowerCase()}"
                                                  class="badge status-badge-inline"
                                                  th:text="${post.marketStatusDescription}">
                                            </span>
                                        </th:block>
                                        <!-- 거래 -->
                                        <th:block th:if="${post.tradeStatus != null}">
                                            <span th:classappend="${'badge-' + post.tradeStatus.toLowerCase()}"
                                                  class="badge status-badge-inline"
                                                  th:text="${post.tradeStatusDescription}">
                                            </span>
                                        </th:block>
                                        <th:block th:if="${post.tradeType != null}">
                                            <span th:if="${post.tradeType == 'SELL'}"
                                                  class="trade-type">[판매]</span>
                                            <span th:if="${post.tradeType == 'BUY'}"
                                                  class="trade-type">[구매]</span>
                                        </th:block>

                                        <a th:href="@{/community/{bCode}/{cCode}/{id}(bCode=${board.code}, cCode=${categoryCode}, id=${post.id})}"
                                           th:text="${post.title}">제목</a> <span th:if="${post.commentCount > 0}"
                                              th:text="'[' + ${post.commentCount} + ']'"
                                              class="text-small comment-count-inline"></span>
                                        <span th:if="${post.hasImage}" class="img-icon-grey"><i class="fa-regular fa-image"></i>️</span>
                                    </td>
                                    <td class="text-center">
                                        <div class="view-container">
                                            <i class="fa-regular fa-eye"></i><span th:text="${post.viewCount}" style="margin-left: 6px;">123</span>
                                        </div>
                                    </td>
                                    <td th:text="${post.writer}" class="text-center">작성자</td>
                                    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}" class="text-small date-cell"></td>
                                </tr>
                            </tbody>
                        </table>

                        <div th:if="${posts.isEmpty()}" class="no-data text-muted">
                            <div th:if="${keyword != null and !keyword.isEmpty()}">
                                <p class="sub-title">
                                    '<span th:text="${keyword}" class="text-primary"></span>'에 대한 검색 결과가 없습니다.
                                </p>
                                <p>단어의 철자가 정확한지 확인한 후 다시 검색해 보세요.</p>
                                <a th:href="@{/community/{boardCode}/all(boardCode=${boardCode})}" class="btn btn-outline-secondary btn-sm mt-3">
                                    전체 목록으로 돌아가기
                                </a>
                            </div>

                            <div th:unless="${keyword != null and !keyword.isEmpty()}">
                                <p class="sub-title">등록된 게시글이 없습니다.</p>
                                <p>이 게시판의 첫 번째 주인공이 되어보세요!</p>
                                <a th:href="@{/community/{code}/write(code=${boardCode})}" class="btn btn-primary btn-sm mt-3">
                                    새 게시글 작성하기
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="page-footer">
                        <div th:replace="~{community/fragments/postpaging :: pagination(page=${page}, boardCode=${boardCode}, categoryCode=${categoryCode})}"></div>
                    </div>
                </div>
            </main>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

</body>
</html>
