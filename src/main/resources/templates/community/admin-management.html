<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{community/fragments/head :: commHead(pageTitle='커뮤니티')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/community/adminpage.css}">
</head>

<body>
<div class="main-layout" style="display: flex; min-height: 100vh;">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='community')}"></div>
    <div class="main-wrapper" style="flex: 1; display: flex; flex-direction: column;">
        <main class="main-wrapper content-community" style="flex: 1; display: flex; flex-direction: column;">
            <div th:replace="~{fragments/headerCurrentMenuView :: path(${ {'community'} })}"></div>
            <div th:replace="~{fragments/headerCategoryMenu :: communityAdmin}"></div>

            <section class="admin-content-area">
                <div class="alert-container">
                    <!-- 성공 메시지 (message) -->
                    <div th:if="${message}" class="alert-banner alert-success">
                        <span th:text="${message}">성공 메시지 영역</span>
                        <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
                    </div>
                    <!-- 에러 메시지 (errorMessage) -->
                    <div th:if="${errorMessage}" class="alert-banner alert-error">
                        <span th:text="${errorMessage}">에러 메시지 영역</span>
                        <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
                    </div>
                </div>

                <div class="admin-guide">
                    <h3>📌 관리자 페이지 안내</h3>
                    <p>게시판과 카테고리를 생성 및 관리할 수 있습니다.</p>
                    <ul>
                        <li>게시판은 최대 5개까지 생성 가능합니다.</li>
                        <li>카테고리는 게시판별로 최대 5개까지 생성 가능합니다.</li>
                        <li>시스템 기본 데이터는 수정/삭제가 불가능합니다.</li>
                    </ul>
                </div>

                <div class="admin-header">
                    <h2>커뮤니티 설정</h2>
                    <button type="button" class="btn btn-primary" onclick="openCreateModal()">
                        + 새 게시판
                    </button>
                </div>

                <div id="createModal" class="modal-overlay">
                    <div class="modal-content admin-form-card">
                        <div class="modal-header">
                            <h3>새 게시판 등록</h3>
                            <button type="button" class="btn-close-x" onclick="closeModal()">&times;</button>
                        </div>

                        <form th:action="@{/community/admin/board/create}" th:object="${adminBoardRqDTO}" method="post" id="createBoardForm">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="form-row">
                                <div class="form-group">
                                    <label>게시판 이름</label>
                                    <input type="text" th:field="*{boardName}" placeholder="예: 갤러리" required>
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label>게시판 코드 (URL용)</label>
                                    <input type="text" name="boardCode" placeholder="예: gallery" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>카테고리 구성 (최대 5개)</label>
                                <div id="category-container">
                                    <!-- 첫 번째 카테고리는 기본으로 표시 -->
                                    <div th:replace="~{community/fragments/categoryItem :: categoryItem}"></div>
                                </div>
                                <button type="button" id="btn-add-category" class="btn-add-sub" onclick="addNewCategory()">+ 카테고리 추가</button>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-save" id="btn-submit">저장하기</button>
                                <button type="button" class="btn btn-close" onclick="closeModal()">취소</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="admin-list-box">
                    <div th:replace="~{community/fragments/boardList :: boardList}"></div>
                </div>
            </section>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:src="@{/js/community/adminpage.js}"></script>
</body>
</html>
