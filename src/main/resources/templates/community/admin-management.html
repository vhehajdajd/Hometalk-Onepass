<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{community/fragments/head :: commHead(pageTitle='커뮤니티 관리')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/community/adminpage.css}">
</head>

<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='community')}"></div>
    <div class="main-wrapper" style="flex: 1; display: flex; flex-direction: column;">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(${ {'community'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: communityAdmin}"></div>
        <main class="dashboard-content">

            <section class="admin-content-area">

                <div class="admin-header">
                    <h2>커뮤니티 설정</h2>
                    <div class="admin-actions flex gap-sm">
                        <a th:href="@{/community/square/all}" class="btn-back-to-community">
                            <i class="fa-solid fa-arrow-left-long"></i> 커뮤니티 게시판
                        </a>
                        <button type="button" class="btn btn-submit rounded" onclick="openCreateModal()">
                            + 새 게시판
                        </button>
                    </div>
                </div>

                <div class="alert-container">
                    <!-- 성공 메시지 (message) -->
                    <div th:if="${message}" class="alert-banner alert-success">
                        <span th:text="${message}">성공 메시지 영역</span>
                        <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
                    </div>
                    <!-- 에러 메시지 (errorMessage) -->
                    <div th:if="${errorMessage}" class="alert-banner alert-error">
                        <span th:text="${errorMessage}">에러 메시지 영역</span>
                        <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
                    </div>
                </div>

                <div class="admin-guide">
                    <h3>
                        <i class="fas fa-thumbtack"></i>
                        관리자 페이지 안내
                    </h3>
                    <p>게시판, 카테고리 및 게시판 화면 유형을 관리할 수 있습니다.</p>
                    <ul>
                        <li>게시판은 <strong>최대 5개</strong>까지 생성 가능합니다.</li>
                        <li>카테고리는 게시판별로 <strong>최대 5개</strong>까지 생성 가능합니다.</li>
                        <li><strong>게시판 유형</strong>은 리스트형 / 카드형 / 갤러리형 중 선택 가능합니다.</li>
                        <li>게시판 유형 변경 시 기존 게시글의 화면 구성이 달라질 수 있습니다.</li>
                        <li>시스템 기본 데이터는 수정/삭제가 <strong>제한</strong>됩니다.</li>
                    </ul>
                </div>

                <div id="createModal" class="modal-overlay">
                    <div class="modal-content admin-form-card">
                        <div class="modal-header">
                            <h3 class="modal-header-title">새 게시판 등록</h3>
                            <button type="button" class="btn-close-x" onclick="closeModal()">&times;</button>
                        </div>

                        <form th:action="@{/community/admin/board/create}" th:object="${adminBoardRqDTO}" method="post" id="createBoardForm">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="form-row">
                                <div class="form-group">
                                    <label>게시판 이름</label>
                                    <input type="text" th:field="*{boardName}" placeholder="예: 갤러리" required>
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label>게시판 영문명 (URL용)</label>
                                    <input type="text"
                                           name="boardCode"
                                           placeholder="예: gallery"
                                           pattern="[a-zA-Z0-9_-]+"
                                           title="영문, 숫자, -, _ 만 입력 가능합니다."
                                           required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>게시판 화면 유형</label>

                                <div class="board-type-group">

                                    <label class="board-type-card">
                                        <input type="radio"
                                               name="boardType"
                                               value="LIST"
                                               checked>

                                        <div class="board-type-preview">
                                            <i class="fa-solid fa-table-list"></i>
                                            <strong>리스트형</strong>
                                            <p>일반 게시판</p>
                                        </div>
                                    </label>

                                    <label class="board-type-card">
                                        <input type="radio"
                                               name="boardType"
                                               value="CARD">

                                        <div class="board-type-preview">
                                            <i class="fa-solid fa-grip"></i>
                                            <strong>카드형</strong>
                                            <p>중고거래 · 나눔</p>
                                        </div>
                                    </label>

                                    <label class="board-type-card">
                                        <input type="radio"
                                               name="boardType"
                                               value="GALLERY">

                                        <div class="board-type-preview">
                                            <i class="fa-regular fa-image"></i>
                                            <strong>갤러리형</strong>
                                            <p>사진 중심 게시판</p>
                                        </div>
                                    </label>

                                </div>
                            </div>
                            <div class="form-group">
                                <label>카테고리 구성 (최대 5개)</label>
                                <div id="category-container">
                                    <!-- 첫 번째 카테고리는 기본으로 표시 -->
                                    <div th:replace="~{community/fragments/categoryItem :: categoryItem}"></div>
                                </div>
                                <button type="button" id="btn-add-category" class="btn btn-add-sub" onclick="addNewCategory()">+ 카테고리 추가</button>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-save" id="btn-submit">저장</button>
                                <button type="button" class="btn btn-close" onclick="closeModal()">취소</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="admin-list-box">
                    <div th:replace="~{community/fragments/boardList :: boardList}"></div>
                </div>
            </section>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:src="@{/js/community/api.js}"></script>
<script defer th:src="@{/js/community/post-modal.js}"></script>
<script defer th:src="@{/js/community/adminpage.js}"></script>
</body>
</html>
