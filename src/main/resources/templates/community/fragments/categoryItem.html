<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="categoryItem" class="category-item-wrapper border p-3 mb-2 rounded bg-white">

  <div class="d-flex gap-2 mb-2">
    <input type="text" name="categoryNames" class="form-control" placeholder="이름 (예: 자유)" required>
    <input type="text" name="categoryCodes" class="form-control" placeholder="코드 (예: free)" required style="flex: 1;">
    <button type="button" class="btn-remove btn btn-outline-danger" onclick="removeCategory(this)">×</button>
  </div>

  <div class="color-preset-section">
    <label class="small text-muted d-block mb-1">테마 선택 (배경 | 글자)</label>
    <div class="d-flex flex-wrap gap-2">
      <!-- 13가지 프리셋 루프 (또는 직접 나열) -->
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#003366|#E6F0FF" checked>
        <span class="preset-dot" style="background: linear-gradient(135deg, #003366 50%, #E6F0FF 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#FF7F50|#FFF0EB">
        <span class="preset-dot" style="background: linear-gradient(135deg, #FF7F50 50%, #FFF0EB 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#3EB489|#002211">
        <span class="preset-dot" style="background: linear-gradient(135deg, #3EB489 50%, #002211 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#FFC107|#543B00">
        <span class="preset-dot" style="background: linear-gradient(135deg, #FFC107 50%, #543B00 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#6610F2|#F1E9FF">
        <span class="preset-dot" style="background: linear-gradient(135deg, #6610F2 50%, #F1E9FF 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#E83E8C|#3B0019">
        <span class="preset-dot" style="background: linear-gradient(135deg, #E83E8C 50%, #3B0019 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#D1E7DD|#0F5132">
        <span class="preset-dot" style="background: linear-gradient(135deg, #D1E7DD 50%, #0F5132 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#FEF3C7|#92400E">
        <span class="preset-dot" style="background: linear-gradient(135deg, #FEF3C7 50%, #92400E 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#CFE2FF|#084298">
        <span class="preset-dot" style="background: linear-gradient(135deg, #CFE2FF 50%, #084298 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#F8D7DA|#842029">
        <span class="preset-dot" style="background: linear-gradient(135deg, #F8D7DA 50%, #842029 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#E2E3E5|#41464B">
        <span class="preset-dot" style="background: linear-gradient(135deg, #E2E3E5 50%, #41464B 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#6F42C1|#FFFFFF">
        <span class="preset-dot" style="background: linear-gradient(135deg, #6F42C1 50%, #FFFFFF 50%);"></span>
      </label>
      <label class="preset-label">
        <input type="radio" th:name="'categoryTheme' + ${itemIdx}" value="#17A2B8|#002329">
        <span class="preset-dot" style="background: linear-gradient(135deg, #17A2B8 50%, #002329 50%);"></span>
      </label>
    </div>
  </div>
</div>

</html>
