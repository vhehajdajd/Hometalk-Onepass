<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="categoryBanner(board, categories, categoryId)" class="category-tab-wrapper">
        <style>
            /* 전체 감싸는 영역 */
            .category-tab-wrapper {
                margin-top: 2rem;
                background-color: transparent;
            }

            .category-tab-wrapper h2 {
                font-size: 1.5rem;
                color: #032154;
                margin-bottom: 1rem;
                font-weight: bold;
            }

            /* 탭 컨테이너: 가로로 나란히 꽉 채움 */
            .category-tabs {
                display: flex;
                width: 100%;
                list-style: none;
                padding: 0;
                margin: 0;
                border-bottom: 1px solid #dee2e6; /* 전체 하단 선 */
            }

            /* 각 탭 아이템 스타일 */
            .category-tabs a {
                flex: 1; /* 가로 너비 균등 배분 */
                text-align: center;
                padding: 1rem 0;
                text-decoration: none;
                font-size: 1rem;
                font-weight: 500;
                color: #888; /* 비활성 텍스트 */
                background-color: #f1f3f5; /* 비활성: 조금 어두운 배경 */
                border: 1px solid #dee2e6;
                border-bottom: none;
                margin-right: -1px; /* 테두리 중첩 방지 */
                transition: all 0.2s;
            }

            /* 활성화된 탭 (Active) */
            .category-tabs a.active {
                background-color: #ffffff; /* 활성: 밝은 흰색 */
                color: #EB6E57; /* 포인트 코랄색 */
                font-weight: 700;
                position: relative;
                margin-bottom: -1px;
                border-bottom: 1px solid #ffffff;
                z-index: 1;
            }

            /* 활성화 탭 상단 포인트 라인 */
            .category-tabs a.active::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 3px;
                background-color: #EB6E57;
            }

            .category-tabs a:hover:not(.active) {
                background-color: #e9ecef;
            }
        </style>


        <h2 th:text="${board.name}">광장</h2>
        <nav class="category-tabs">
            <a href="#" th:href="@{/community/{boardCode}(boardCode=${board.code})}"
                th:classappend="${categoryCode == 'all' or categoryCode == null} ? 'active' : ''">전체</a>

            <th:block th:each="category : ${categories}">
            <a th:if="${category.code != 'all'}"
               href="#" th:href="@{/community/{boardCode}/{categoryCode}(boardCode=${board.code}, categoryCode=${category.code})}"
               th:text="${category.name}"
               th:classappend="${categoryCode == category.code ? 'active' : ''}">카테고리명</a>
            </th:block>
        </nav>
    </div>
</body>
</html>
