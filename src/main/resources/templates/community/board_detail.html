<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{community/fragments/head :: commHead(pageTitle='커뮤니티')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/community/adminpage.css}">
</head>
<body>
<div class="main-layout" style="display: flex; min-height: 100vh;">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='community')}"></div>
    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(${ {'community'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: communityAdmin}"></div>

        <main class="dashboard-content">
            <div class="detail-container">
                <div class="alert-container">
                    <div th:if="${message}" class="alert-banner alert-success">
                        <span th:text="${message}">성공 메시지 영역</span>
                        <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
                    </div>

                    <div th:if="${errorMessage}" class="alert-banner alert-error">
                        <span th:text="${errorMessage}">에러 메시지 영역</span>
                        <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
                    </div>
                </div>

                <div class="board-header">
                    <h2 th:text="'게시판 관리: ' + ${board.name}">게시판 이름</h2>
                    <p th:if="${board.isSystem}" class="text-system">
                        * 이 게시판은 시스템 필수 게시판으로 삭제가 제한됩니다.
                    </p>

                    <div th:if="${!board.isSystem}">
                        <form th:action="@{/community/admin/board/delete/{id}(id=${board.id})}" method="post">
                            <button type="submit"
                                    class="btn-hard-delete"
                                    onclick="return confirm('정말로 이 게시판을 삭제하시겠습니까?\n삭제된 게시판의 데이터는 복구할 수 없습니다.')">
                                게시판 삭제
                            </button>
                        </form>
                    </div>
                </div>

                <h3>카테고리 설정</h3>

                <ul class="category-list">
                    <li th:each="cat : ${board.categories}"
                        class="category-list-item"
                        th:id="'item-' + ${cat.id}">

                        <div class="category-info">
                            <span class="view-mode"
                                  th:id="'name-text-' + ${cat.id}"
                                  th:text="'- ' + ${cat.name}">
                                - 이름
                            </span>

                            <div class="edit-mode"
                                 th:id="'edit-form-' + ${cat.id}"
                                 style="display: none;">

                                <input type="text"
                                       th:id="'input-' + ${cat.id}"
                                       th:value="${cat.name}"
                                       class="form-control">

                                <button class="btn btn-save"
                                        type="button"
                                        th:data-id="${cat.id}"
                                        th:data-board-id="${board.id}"
                                        onclick="saveEdit(this.dataset.id, this.dataset.boardId)">
                                    저장
                                </button>

                                <button class="btn btn-close"
                                        type="button"
                                        th:data-id="${cat.id}"
                                        onclick="toggleEdit(this.dataset.id, false)">
                                    취소
                                </button>
                            </div>

                            <small class="badge-count"
                                   th:text="'(' + ${cat.postCount} + ')'">
                                (0)
                            </small>
                        </div>

                        <div class="btn-group view-mode"
                             th:id="'btn-group-' + ${cat.id}">
                            <th:block th:if="${!cat.isSystem}">
                                <button class="btn btn-primary"
                                        type="button"
                                        th:data-id="${cat.id}"
                                        onclick="toggleEdit(this.dataset.id, true)">
                                    수정
                                </button>

                                <button class="btn btn-danger-outline"
                                        type="button"
                                        th:data-id="${cat.id}"
                                        th:data-count="${cat.postCount}"
                                        th:data-board-id="${board.id}"
                                        onclick="deleteCategory(this.dataset.id, this.dataset.count, this.dataset.boardId)">
                                    삭제
                                </button>
                            </th:block>
                        </div>
                    </li>
                </ul>

                <div class="add-category-area">
                    <form th:action="@{/community/admin/category/create}"
                          method="post"
                          id="categoryCreateForm">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <input type="hidden"
                               name="boardId"
                               th:value="${board.id}">

                        <div id="category-container">
                            <div th:replace="~{community/fragments/categoryItem :: categoryItem}"></div>
                        </div>

                        <button type="submit" class="btn btn-add-sub">
                            + 카테고리 추가
                        </button>
                    </form>
                </div>

                <div style="margin-top: 30px;">
                    <a th:href="@{/community/admin}" class="btn btn-outline">
                        ← 목록으로 돌아가기
                    </a>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:src="@{/js/community/adminpage.js}"></script>

<script>
    function toggleEdit(id, isEdit) {
        const viewElements = document.querySelectorAll(`#name-text-${id}, #btn-group-${id}`);
        const editForm = document.getElementById(`edit-form-${id}`);

        if (isEdit) {
            viewElements.forEach(el => el.style.display = 'none');
            editForm.style.display = 'inline-flex';
        } else {
            viewElements.forEach(el => el.style.display = 'inline-block');
            editForm.style.display = 'none';
        }
    }

    function saveEdit(id, boardId) {
        const newName = document.getElementById(`input-${id}`).value;

        if (!newName || newName.trim() === "") {
            alert("카테고리 이름을 입력해주세요.");
            return;
        }

        location.href = `../category/update/${id}?name=${encodeURIComponent(newName)}&boardId=${boardId}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("categoryCreateForm");

        if (!form) return;

        form.addEventListener("submit", () => {
            form.querySelectorAll(".temp-hidden-input").forEach(el => el.remove());

            const nameInput = form.querySelector('input[name="categoryNames"]');
            const codeInput = form.querySelector('input[name="categoryCodes"]');

            if (nameInput) {
                const hiddenName = document.createElement("input");
                hiddenName.type = "hidden";
                hiddenName.name = "name";
                hiddenName.value = nameInput.value;
                hiddenName.className = "temp-hidden-input";
                form.appendChild(hiddenName);
            }

            if (codeInput) {
                const hiddenCode = document.createElement("input");
                hiddenCode.type = "hidden";
                hiddenCode.name = "code";
                hiddenCode.value = codeInput.value;
                hiddenCode.className = "temp-hidden-input";
                form.appendChild(hiddenCode);
            }

            const selectedTheme = form.querySelector('input[type="radio"]:checked');

            if (selectedTheme) {
                const colors = selectedTheme.value.split("|");

                const bgInput = document.createElement("input");
                bgInput.type = "hidden";
                bgInput.name = "bgColor";
                bgInput.value = colors[0];
                bgInput.className = "temp-hidden-input";
                form.appendChild(bgInput);

                const textInput = document.createElement("input");
                textInput.type = "hidden";
                textInput.name = "textColor";
                textInput.value = colors[1];
                textInput.className = "temp-hidden-input";
                form.appendChild(textInput);
            }
        });
    });

    function deleteCategory(id, count, boardId) {
        console.log("삭제 시도 - 카테고리ID:", id, "글개수:", count, "게시판ID:", boardId);

        if (count > 0) {
            alert("게시글이 있는 카테고리는 삭제할 수 없습니다.");
            return;
        }

        if (confirm("정말로 삭제하시겠습니까?")) {
            const url = `/hometop/community/admin/category/delete/${id}?boardId=${boardId}`;
            console.log("이동할 최종 주소:", url);
            location.href = url;
        }
    }
</script>
</body>
</html>
