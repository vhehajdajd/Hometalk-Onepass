<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head(pageTitle='커뮤니티')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/community/common.css}">
    <link rel="stylesheet" th:href="@{/css/community/adminpage.css}">
    <style>
        .detail-container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .board-header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .category-list { list-style: none; padding-left: 20px; }
        .category-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; border-bottom: 1px solid #eee;
        }
        .category-info { display: flex; align-items: center; gap: 10px; }
        .btn-group { display: flex; gap: 5px; }
        .btn-sm { padding: 4px 8px; font-size: 12px; cursor: pointer; border-radius: 3px; border: 1px solid #ccc; }
        .btn-edit { background-color: #f8f9fa; }
        .btn-delete { background-color: #fff1f0; color: #ff4d4f; border-color: #ffccc7; }
        .text-system { color: #999; font-size: 12px; font-style: italic; }
        .add-category-area { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px; }
    </style>
</head>
<body class="main-layout">
<div class="main-layout" style="display: flex; min-height: 100vh;">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='community')}"></div>
    <div class="main-wrapper" style="flex: 1; display: flex; flex-direction: column;">
        <main class="main-wrapper content-community" style="flex: 1; display: flex; flex-direction: column;">
            <div th:replace="~{fragments/headerCurrentMenuView :: path(${ {'community', '관리'} })}"></div>
            <div th:replace="~{fragments/headerCategoryMenu :: community}"></div>

            <div class="admin-tab-nav">
                <a th:href="@{/community/admin}" class="tab-item active">게시판/카테고리 설정</a>
                <a th:href="@{/community/admin/posts}" class="tab-item">숨김/삭제 게시글 관리</a>
            </div>

            <div class="detail-container">
                <div class="board-header">
                    <h2 th:text="'게시판 관리: ' + ${board.name}">게시판 이름</h2>
                    <p th:if="${board.isSystem}" class="text-system">* 이 게시판은 시스템 필수 게시판으로 삭제가 제한됩니다.</p>
                </div>

                <h3>카테고리 설정</h3>
                <ul class="category-list">
                    <li th:each="cat : ${board.categories}" class="category-item">
                        <div class="category-info">
                            <span th:text="'- ' + ${cat.name}">- 카테고리 이름</span>
                            <small class="badge-count" th:text="'(' + ${cat.postCount} + ')'">(5)</small>
                            <span th:if="${cat.isSystem}" class="text-system">[기본]</span>
                        </div>

                        <div class="btn-group">
                            <th:block th:if="${!cat.isSystem}">
                                <button class="btn-sm btn-edit" th:onclick="|openEditCategoryModal(${cat.id}, '${cat.name}, ${board.id}')|">수정</button>
                                <button class="btn-sm btn-delete" th:onclick="|deleteCategory(${cat.id}, ${cat.postCount}, ${board.id})|">삭제</button>
                            </th:block>
                            <span th:if="${cat.isSystem}" class="text-system">수정불가</span>
                        </div>
                    </li>
                </ul>

                <div class="add-category-area">
                    <form th:action="@{/community/admin/category/create}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="boardId" th:value="${board.id}">
                        <input type="text" name="name" placeholder="새 카테고리 이름 입력" required>
                        <button type="submit" class="btn-sm" style="background: #e6f7ff; border-color: #91d5ff;">+ 카테고리 추가</button>
                    </form>
                </div>

                <div style="margin-top: 30px;">
                    <a th:href="@{/community/admin}" style="text-decoration: none; color: #666;">← 목록으로 돌아가기</a>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:src="@{/js/community/adminpage.js}"></script>
<script>
    function deleteCategory(id, count, boardId) {
        if (count > 0) {
            alert("해당 카테고리에 게시글이 " + count + "개 남아있습니다.\n글을 모두 삭제하거나 이동한 후 다시 시도해주세요.");
            return;
        }
        if (confirm("정말로 이 카테고리를 삭제하시겠습니까?")) {
            // 삭제 요청 로직 (fetch 또는 form submit)
            location.href = `/hometop/community/admin/category/delete/${id}?boardId=${boardId}`;
        }
    }

    function openEditCategoryModal(id, name, boardId) {
        const newName = prompt("수정할 카테고리 이름을 입력하세요:", name);
        if (newName && newName !== name) {
            location.href = `/hometop/community/admin/category/update/${id}?name=${newName}&boardId=${boardId}`;
        }
    }
</script>
</body>
</html>
