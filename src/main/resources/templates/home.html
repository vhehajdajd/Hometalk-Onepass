<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포레스트 리움 - 홈</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --color-main:            #032154;
          --color-text-muted:      #888888;
          --color-btn-point:       #EB6E57;
          --color-btn:             #4073C9;
          --border-color:          #E2E8F0;
          --color-btn-point-hover: #D65A45;
          --color-modal-line:      #F1F5F9;
          --color-text:            #000000;

          --surface:     #FFFFFF;
          --bg:          #FFFFFF;
          --border:      var(--border-color);
          --text-main:   var(--color-text);
          --text-sub:    var(--color-text-muted);
          --text-hint:   #9CA3AF;
          --radius-md:   12px;
          --radius-lg:   16px;
          --shadow-card: 0 1px 4px rgba(0,0,0,0.07);

          --badge-normal-bg:   #EFF6FF; --badge-normal-txt:   #1D4ED8;
          --badge-facility-bg: #F0FDF4; --badge-facility-txt: #166534;
          --badge-safety-bg:   #FEF3C7; --badge-safety-txt:   #92400E;
          --badge-urgent-bg:   #FEE2E2; --badge-urgent-txt:   #991B1B;
          --badge-notice-bg:   #F3F4F6; --badge-notice-txt:   #374151;
        }

        body {
          padding-top: 50px;
          font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
          background: var(--bg);
          color: var(--text-main);
          min-height: 100vh;
        }
        /* ── 네브바 버튼 ── */
.nav-btn {
    color: #032154;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 16px;
    transition: all 0.25s ease;
    border: none;
    border-radius: 6px;
}
.nav-btn:hover {
    color: #4073C9;
    text-shadow: 0 0 12px rgba(64, 115, 201, 0.5), 0 0 24px rgba(64, 115, 201, 0.3);
}

        /* ── BANNER ── */
        .banner {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            background: #1a2e44;
        }
        .banner img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center 20%;
          display: block;
        }
        .banner-overlay {
          position: absolute;
          inset: 0;
          background: linear-gradient(to right, rgba(10,20,40,0.72) 0%, rgba(10,20,40,0.22) 60%, transparent 100%);
          display: flex;
          align-items: center;
          /* Fix: clamp으로 모바일 답답함 해소 */
          padding: 0 clamp(20px, 5vw, 60px);
        }
        .banner-text h1 {
          font-size: 2.25rem;
          font-weight: 700;
          color: #ffffff;
          line-height: 1.25;
          letter-spacing: -0.02em;
          margin-bottom: 12px;
        }
        .banner-text p {
          font-size: 1rem;
          color: rgba(255,255,255,0.82);
          line-height: 1.6;
        }

        /* ── MAIN CONTENT ── */
        .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 32px 24px 60px;
        }

        /* ── INFO CARDS ── */
        .info-grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 20px;
          margin-bottom: 40px;
        }
        .card {
          background: var(--surface);
          border-radius: var(--radius-lg);
          border: 1px solid var(--border);
          padding: 20px 22px;
          box-shadow: var(--shadow-card);
        }
        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 16px;
        }
        .card-header-left {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 0.9375rem;
          font-weight: 600;
          color: var(--text-main);
        }
        .card-header-left svg { color: var(--color-btn); }
        .more-btn {
          font-size: 0.8125rem;
          color: var(--text-sub);
          display: flex;
          align-items: center;
          gap: 2px;
          cursor: pointer;
          background: none;
          border: none;
          padding: 0;
        }
        .more-btn:hover { color: var(--color-btn); }

        /* ── 스켈레톤 ── */
        .skeleton-wrap { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
        .skeleton-line {
          height: 14px;
          background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
          background-size: 200% 100%;
          border-radius: 6px;
          animation: shimmer 1.4s infinite;
        }
        .skeleton-line.short  { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        .skeleton-line.long   { width: 95%; }
        @keyframes shimmer {
          0%   { background-position: 200% 0; }
          100% { background-position: -200% 0; }
        }

        /* ── 에러 상태 ── */
        .error-state {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          padding: 20px 0;
          text-align: center;
        }
        .error-state svg { color: #EF4444; opacity: 0.7; }
        .error-state p   { font-size: 0.8125rem; color: var(--text-hint); }
        .retry-btn {
          font-size: 0.75rem;
          color: var(--color-btn);
          background: none;
          border: 1px solid var(--color-btn);
          border-radius: 6px;
          padding: 4px 12px;
          cursor: pointer;
          margin-top: 4px;
        }
        .retry-btn:hover { background: #EFF6FF; }

        /* ── 공지사항 ── */
        .notice-list { list-style: none; }
        .notice-item {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 7px 0;
          border-bottom: 1px solid var(--border);
          cursor: pointer;
        }
        .notice-item:last-child { border-bottom: none; }
        .notice-item:hover .notice-title { color: var(--color-btn); }

        .badge {
          flex-shrink: 0;
          font-size: 0.6875rem;
          font-weight: 600;
          padding: 2px 7px;
          border-radius: 4px;
          white-space: nowrap;
        }
        .badge-urgent   { background: var(--badge-urgent-bg);   color: var(--badge-urgent-txt); }
        .badge-notice   { background: var(--badge-notice-bg);   color: var(--badge-notice-txt); }
        .badge-normal   { background: var(--badge-normal-bg);   color: var(--badge-normal-txt); }
        .badge-facility { background: var(--badge-facility-bg); color: var(--badge-facility-txt); }
        .badge-safety   { background: var(--badge-safety-bg);   color: var(--badge-safety-txt); }

        .notice-title {
          flex: 1;
          font-size: 0.8125rem;
          color: var(--text-main);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          transition: color 0.15s;
        }
        .notice-date {
          flex-shrink: 0;
          font-size: 0.75rem;
          color: var(--text-hint);
        }
        .notice-empty {
          font-size: 0.8125rem;
          color: var(--text-hint);
          text-align: center;
          padding: 20px 0;
        }

        /* ── 오늘의 일정 ── */
        .schedule-list { list-style: none; }
        .schedule-item {
          display: flex;
          align-items: flex-start;
          gap: 10px;
          padding: 7px 0;
          border-bottom: 1px solid var(--border);
          cursor: pointer;
        }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;]
          flex-shrink: 0;
          margin-top: 5px;
        }
        /* CSS 클래스는 대문자 고정 → JS에서 toUpperCase() 처리 */
        .dot-NORMAL   { background: #3B82F6; }
        .dot-FACILITY { background: #10B981; }
        .dot-SAFETY   { background: #F59E0B; }
        .dot-DEFAULT  { background: #9CA3AF; }

        .schedule-info { flex: 1; min-width: 0; }
        .schedule-title {
          font-size: 0.8125rem;
          color: var(--text-main);
          font-weight: 500;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .schedule-time {
          font-size: 0.75rem;
          color: var(--text-hint);
          margin-top: 2px;
        }
        .schedule-empty {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 24px 0 12px;
          gap: 10px;
        }
        .schedule-empty svg  { color: var(--text-hint); opacity: 0.5; }
        .schedule-empty p    { font-size: 0.8125rem; color: var(--text-hint); text-align: center; }
        .schedule-empty .sub { font-size: 0.75rem; color: var(--text-hint); opacity: 0.7; }

        /* ── 커뮤니티 ── */
        .community-list { list-style: none; }
        .community-item {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 0;
          border-bottom: 1px solid var(--border);
          cursor: pointer;
        }
        .community-item:last-child { border-bottom: none; }
        .community-item:hover .community-title { color: var(--color-btn); }
        .community-cat {
          flex-shrink: 0;
          font-size: 0.6875rem;
          font-weight: 600;
          padding: 2px 7px;
          border-radius: 4px;
          background: #F3F4F6;
          color: #374151;
        }
        .community-title {
          flex: 1;
          font-size: 0.8125rem;
          color: var(--text-main);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          transition: color 0.15s;
        }
        .community-empty {
          font-size: 0.8125rem;
          color: var(--text-hint);
          text-align: center;
          padding: 20px 0;
        }

        /* 커뮤니티 로그인 유도 */
        .login-prompt {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          margin-top: 16px;
          padding: 14px 16px;
          background: var(--color-modal-line);
          border-radius: 10px;
          border: 1px solid var(--border-color);
          text-align: center;
        }
        .login-prompt-text {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 0.8125rem;
          color: var(--color-text-muted);
          line-height: 1.5;
        }
        .login-prompt-btn {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 0.8125rem;
          font-weight: 600;
          color: #ffffff;
          background: var(--color-btn);
          border: none;
          border-radius: 6px;
          padding: 6px 16px;
          cursor: pointer;
          transition: background 0.15s;
        }
        .login-prompt-btn:hover { background: var(--color-main); }

        /* ── 주요 서비스 ── */
        .section-title {
          font-size: 1rem;
          font-weight: 700;
          color: var(--text-main);
          margin-bottom: 16px;
        }
        .service-grid {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 16px;
        }
        .service-card {
          background: var(--surface);
          border-radius: var(--radius-lg);
          border: 1px solid var(--border);
          padding: 24px 16px 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          cursor: pointer;
          text-align: center;
          box-shadow: var(--shadow-card);
          transition: box-shadow 0.18s, transform 0.18s;
        }
        .service-card:hover {
          box-shadow: 0 4px 16px rgba(37,99,235,0.1);
          transform: translateY(-2px);
        }
        .service-icon {
          width: 52px;
          height: 52px;
          border-radius: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .icon-civil     { background: #EFF6FF; color: var(--color-btn); }
        .icon-facility  { background: #ECFDF5; color: #059669; }
        .icon-billing   { background: #FFFBEB; color: #D97706; }
        .icon-parking   { background: #EFF6FF; color: var(--color-btn); }
        .icon-community { background: #F5F3FF; color: var(--color-btn-point); }
        .service-name {
          font-size: 0.9375rem;
          font-weight: 600;
          color: var(--text-main);
        }
        .service-desc {
          font-size: 0.75rem;
          color: var(--text-sub);
          line-height: 1.5;
        }

        /* ── 토스트 ── */
        #toast {
          position: fixed;
          bottom: 32px;
          left: 50%;
          transform: translateX(-50%) translateY(8px);
          background: #1F2937;
          color: #fff;
          font-size: 0.8125rem;
          padding: 10px 20px;
          border-radius: 8px;
          z-index: 9999;
          opacity: 0;
          max-width: 360px;
          text-align: center;
          transition: opacity 0.2s, transform 0.2s;
          pointer-events: none;
          white-space: pre-line;
        }
        #toast.show {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 960px) {
          .info-grid    { grid-template-columns: 1fr; }
          .service-grid { grid-template-columns: repeat(3, 1fr); }
          .banner-text h1 { font-size: 1.75rem; }
        }
        @media (max-width: 600px) {
          .service-grid { grid-template-columns: repeat(2, 1fr); }
          .banner       { height: 240px; }
          .banner-text h1 { font-size: 1.4rem; }
          .container    { padding: 20px 16px 48px; }
        }
    </style>
</head>
<body>
<!-- ════════ 상단 네브바 ════════ -->

<!-- ════════ 배너 ════════ -->
<section class="banner">
    <img th:src="@{/images/banner.png}" alt="포레스트 리움 단지 전경"
         onerror="this.style.display='none'" />
    <div class="banner-overlay">
        <div class="banner-text">
            <h1>안녕하세요,<br>포레스트 리움입니다.</h1>

<!-- ════════ 정보 카드 3단 ════════ -->
<div class="container">
    <div class="info-grid">

        <!-- 공지사항 -->
        <div class="card">
            <div class="card-header">
        <span class="card-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          공지사항
        </span>
                <button class="more-btn" onclick="goService('notice')">
                    더보기
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>
            <ul class="notice-list" id="notice-list">
                <li><div class="skeleton-wrap"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></li>
            </ul>
        </div>

        <!-- 오늘의 일정 -->
        <div class="card">
            <div class="card-header">
        <span class="card-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          오늘의 일정
        </span>
            </div>
            <ul class="schedule-list" id="schedule-list">
                <li><div class="skeleton-wrap"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></li>
            </ul>
        </div>

        <!-- 커뮤니티 -->
        <div class="card">
            <div class="card-header">
        <span class="card-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          커뮤니티
        </span>
                <button class="more-btn" onclick="goService('community')">
                    더보기
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>
            <ul class="community-list" id="community-list">
                <li><div class="skeleton-wrap"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div></li>
            </ul>
            <div class="login-prompt" id="login-prompt" style="display:none;">
        <span class="login-prompt-text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>

          </svg>
          로그인 후 전체 게시글을 확인할 수 있어요

    <!-- ════════ 주요 서비스 ════════ -->
    <p class="section-title">주요 서비스</p>
    <div class="service-grid">

        <div class="service-card" onclick="goService('civil')">

        <div class="service-card" onclick="goService('facility')">

        <div class="service-card" onclick="goService('billing')">
            <div class="service-icon icon-billing">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                    <line x1="7" y1="15" x2="7.01" y2="15"/>
                    <line x1="11" y1="15" x2="13" y2="15"/>
                </svg>
            </div>
            <span class="service-name">관리비 조회</span>
            <span class="service-desc">관리비 내역을<br>간편하게 조회하세요.</span>
        </div>

        <div class="service-card" onclick="goService('parking')">
            <div class="service-icon icon-parking">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="3" width="15" height="13" rx="2"/>
                    <path d="M16 8h4l3 3v5h-7V8z"/>
                    <circle cx="5.5" cy="18.5" r="2.5"/>
                    <circle cx="18.5" cy="18.5" r="2.5"/>
                </svg>
            </div>
            <span class="service-name">주차</span>
            <span class="service-desc">주차 등록 및 방문 차량<br>이용을 확인하세요.</span>
        </div>

        <div class="service-card" onclick="goService('community')">
            <div class="service-icon icon-community">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </div>
            <span class="service-name">커뮤니티</span>
            <span class="service-desc">이웃과 소통하고<br>정보를 나눠요.</span>
        </div>

    </div>
</div>

<!-- 토스트 -->
<div id="toast"></div>

<script>
    /* ════════════════════════════════════════
       [1] 전역 설정
       ════════════════════════════════════════ */
    const CTX = '';

    // ★ JSP:       window.IS_LOGGED_IN = ${not empty sessionScope.loginMember};
    // ★ Thymeleaf: window.IS_LOGGED_IN = [[${session.loginMember != null}]];
    window.IS_LOGGED_IN = false;

    const SERVICE_URLS = {
      notice:    CTX + '/hometop/notice',
      schedule:  CTX + '/hometop/schedule',
      billing:   CTX + '/hometop/billing',
      parking:   CTX + '/hometop/parking/visit',
      community: CTX + '/hometop/community/square/all',
      civil:     CTX + '/hometop/civil',
      facility:  CTX + '/hometop/reservation'
    };

    const API_ENDPOINTS = {
      notice:    CTX + '/notice/api/detail',
      schedule:  CTX + '/schedule/api/calendar',
      community: CTX + '/api/community/recent'
    };


    /* ════════════════════════════════════════
       [2] 페이지 이동 (로그인 체크)
       ════════════════════════════════════════ */
    function goService(serviceKey) {
      const destination = SERVICE_URLS[serviceKey] || SERVICE_URLS['community'];
      if (window.IS_LOGGED_IN) {
        location.href = destination;
      } else {
        showToast('로그인이 필요한 서비스입니다.\n로그인 페이지로 이동합니다.');
        setTimeout(function () {
          location.href = CTX + '/hometop/auth?redirectURL=' + encodeURIComponent(destination);
        }, 1200);
      }
    }

    function goCommunity(boardCode) {
      const destination = CTX + '/hometop/community/' + encodeURIComponent(boardCode) + '/all';
      if (window.IS_LOGGED_IN) {
        location.href = destination;
      } else {
        showToast('로그인이 필요한 서비스입니다.\n로그인 페이지로 이동합니다.');
        setTimeout(function () {
          location.href = CTX + '/hometop/auth?redirectURL=' + encodeURIComponent(destination);
        }, 1200);
      }
    }


    /* ════════════════════════════════════════
       [3] 데이터 로드
       ════════════════════════════════════════ */
    async function initHome() {
      await Promise.allSettled([
        loadSection(API_ENDPOINTS.notice,    renderNotices,   'notice-list',    '공지사항'),
        loadSection(API_ENDPOINTS.schedule,  renderSchedule,  'schedule-list',  '일정'),
        loadSection(API_ENDPOINTS.community, renderCommunity, 'community-list', '커뮤니티')
      ]);

      // 미로그인 시 커뮤니티 로그인 유도 배너 표시
      if (!window.IS_LOGGED_IN) {
        const prompt = document.getElementById('login-prompt');
        if (prompt) prompt.style.display = '';
      }
    }

    // 공통 섹션 로더: 실패 시 해당 섹션만 에러 UI 표시
    async function loadSection(url, renderFn, elId, label) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderFn(data);
      } catch (err) {
        console.error('[' + label + '] 로드 실패:', err);
        showErrorState(elId, label, url, renderFn);
      }
    }

    // Fix: location.reload() 대신 해당 API만 재호출
    function showErrorState(elId, label, url, renderFn) {
      const el = document.getElementById(elId);
      if (!el) return;

      // 재시도 함수를 전역에 임시 등록
      const retryFnName = '_retry_' + elId.replace(/-/g, '_');
      window[retryFnName] = function () {
        el.innerHTML =
          '<li><div class="skeleton-wrap">' +
            '<div class="skeleton-line long"></div>' +
            '<div class="skeleton-line medium"></div>' +
          '</div></li>';
        loadSection(url, renderFn, elId, label);
      };

      el.innerHTML =
        '<li class="error-state">' +
          '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="12" cy="12" r="10"/>' +
            '<line x1="12" y1="8" x2="12" y2="12"/>' +
            '<line x1="12" y1="16" x2="12.01" y2="16"/>' +
          '</svg>' +
          '<p>' + escHtml(label) + ' 정보를 불러오지 못했습니다.</p>' +
          '<button class="retry-btn" onclick="' + retryFnName + '()">다시 시도</button>' +
        '</li>';
    }


    /* ════════════════════════════════════════
       [4] 렌더링 함수
       ════════════════════════════════════════ */

    // 공지사항
    function renderNotices(list) {
      const el = document.getElementById('notice-list');
      if (!el) return;
      if (!list || list.length === 0) {
        el.innerHTML = '<li class="notice-empty">등록된 공지사항이 없습니다.</li>';
        return;
      }
      const BADGE_LABEL = { safety: '안전', facility: '시설', urgent: '긴급', normal: '일반', notice: '공지' };
      el.innerHTML = list.map(function (n) {
        const pin      = n.isPinned ? '📌 ' : '';
        // Fix: badge 소문자 정규화 → CSS 클래스와 항상 일치
        const badgeKey = String(n.badge || 'notice').toLowerCase();
        const badgeTxt = BADGE_LABEL[badgeKey] || '공지';
        return (
          '<li class="notice-item" onclick="goService(\'notice\')">' +
            '<span class="badge badge-' + badgeKey + '">' + badgeTxt + '</span>' +
            '<span class="notice-title">' + pin + escHtml(n.title) + '</span>' +
            '<span class="notice-date">' + formatDate(n.createdAt) + '</span>' +
          '</li>'
        );
      }).join('');
    }

    // 오늘의 일정
    function renderSchedule(list) {
      const el = document.getElementById('schedule-list');
      if (!el) return;
      if (!list || list.length === 0) {
        el.innerHTML =
          '<li class="schedule-empty">' +
            '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
              '<line x1="16" y1="2" x2="16" y2="6"/>' +
              '<line x1="8" y1="2" x2="8" y2="6"/>' +
              '<line x1="3" y1="10" x2="21" y2="10"/>' +
            '</svg>' +
            '<p>오늘 등록된 일정이 없습니다.</p>' +
            '<p class="sub">편안한 하루 보내세요!</p>' +
          '</li>';
        return;
      }
      el.innerHTML = list.map(function (s) {
        // Fix: badge 대소문자 무관하게 toUpperCase()로 CSS 클래스와 항상 일치
        const dotClass = 'dot-' + String(s.badge || 'DEFAULT').toUpperCase();
        // Fix: startAt null/Invalid Date 방어
        const timeStr  = formatTimeRange(s.startAt, s.endAt);
        return (
          '<li class="schedule-item" onclick="goService(\'schedule\')">' +
            '<span class="schedule-dot ' + dotClass + '"></span>' +
            '<div class="schedule-info">' +
              '<span class="schedule-title">' + escHtml(s.title) + '</span>' +
              (timeStr ? '<span class="schedule-time">' + timeStr + '</span>' : '') +
            '</div>' +
          '</li>'
        );
      }).join('');
    }

    // 커뮤니티
    function renderCommunity(list) {
      const el = document.getElementById('community-list');
      if (!el) return;
      if (!list || list.length === 0) {
        el.innerHTML = '<li class="community-empty">최신 게시글이 없습니다.</li>';
        return;
      }
      el.innerHTML = list.map(function (c) {
        // Fix: SERVICE_URLS 오염 제거 → goCommunity() 직접 호출
        // Fix: categoryName null 방어
        const boardCode = escHtml(String(c.boardCode || ''));
        const category  = escHtml(c.categoryName || '일반');
        return (
          '<li class="community-item" onclick="goCommunity(\'' + boardCode + '\')">' +
            '<span class="community-cat">[' + category + ']</span>' +
            '<span class="community-title">' + escHtml(c.title) + '</span>' +
          '</li>'
        );
      }).join('');
    }


    /* ════════════════════════════════════════
       [5] 유틸 함수
       ════════════════════════════════════════ */

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(function () { t.classList.remove('show'); }, 2800);
    }

    // 날짜 포맷 (YYYY.MM.DD) — Invalid Date 방어 포함
    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.getFullYear() + '.' +
        String(d.getMonth() + 1).padStart(2, '0') + '.' +
        String(d.getDate()).padStart(2, '0');
    }

    // 시간 포맷 (HH:mm) — null/Invalid Date 방어 포함
    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
    }

    // 시간 범위 문자열 — startAt null이면 빈 문자열 반환
    function formatTimeRange(startAt, endAt) {
      const start = formatTime(startAt);
      if (!start) return '';
      const end = formatTime(endAt);
      return end ? start + ' ~ ' + end : start;
    }

    // XSS 방지
    function escHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    /* ════════════════════════════════════════
       [6] 초기화
       ════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', initHome);
</script>
</body>
</html>
