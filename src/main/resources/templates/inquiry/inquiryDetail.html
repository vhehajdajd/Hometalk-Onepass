
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='문의 내용')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>
        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">

            <main class="container">
                <div class="post-header mt-lg">
                    <div class="flex-between">
                        <span class="category" th:text="${inquiry.category}">카테고리</span>
                        <span class="badge"
                              th:text="${inquiry.status}"
                              th:classappend="${inquiry.status == '처리완료'} ? 'status-complete' : 'status-waiting' ">상태</span>
                    </div>

                    <h1 class="title mt-sm" th:text="${inquiry.title}">민원 제목</h1>

                    <div class="post-info text-muted mt-sm">
                        <span th:text="|작성자 : ${inquiry.userName}|">작성자</span>
                        <span th:text="${inquiry.createdAt != null ? #temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">작성일</span>
                    </div>
                </div>

                <div class="post-content">
                    <div class="content-body" th:utext="${inquiry.content}" style="min-height: 200px; white-space: pre-wrap;">문의 내용</div>

                    <div th:if="${inquiry.attachments != null and not #lists.isEmpty(inquiry.attachments)}" class="attachments mt-lg" style="margin-top: 30px;">
                        <p class="sub-title">📎 첨부파일</p>
                        <ul class="attachment-list mt-sm">
                            <li th:each="file : ${inquiry.attachments}">
                                <a th:href="@{/inquiries/download(fileName=${file.storedFileName})}"
                                   th:text="${file.originFileName}"
                                   class="text-small" style="color: var(--color-sub); text-decoration: underline;">
                                    파일명
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div th:if="${inquiry.answer != null}" class="admin-answer-section">
                    <h4 class="sub-title">✉️ 관리자 답변</h4>
                    <p th:text="${inquiry.answer}" class="answer-box mt-sm">답변 내용</p>
                </div>

                <div class="admin-only admin-answer-form mt-xl pt-lg">
                    <h3 class="sub-title" style="margin-top: 20px;">관리자 답변 등록</h3>
                    <form th:action="@{/api/inquiries/{id}/respond(id=${inquiry.id})}" method="post" class="mt-sm">
                        <textarea id="adminResponse" name="answer" rows="5" class="input-field" placeholder="여기에 답변을 입력하세요..."></textarea>
                        <div class="flex-end mt-sm">
                            <button type="button" class="btn btn-primary" th:onclick="submitResponse([[${inquiry.id}]])">답변 저장하기</button>
                        </div>
                    </form>
                </div>

                <div class="post-footer flex-between mt-lg pt-lg">
                    <a th:href="@{/inquiries/list}" class="btn btn-outline">목록으로</a>

                    <div class="auth-buttons flex" style="gap: var(--spacing-sm);">
                        <button type="button" class="btn btn-danger-outline" th:onclick="|confirmDelete(${inquiry.id})|">삭제</button>
                    </div>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script th:inline="javascript">
    function confirmDelete(id) {
        if (confirm("정말로 이 문의글을 삭제하시겠습니까?")) {
            fetch(`/hometop/api/inquiries/${id}`, {
                method: 'DELETE'
            })
        }
    }

    async function submitResponse(id) {
        const answerText = document.getElementById('adminResponse').value;
        if(!answerText.trim()) {
            alert("답변 내용을 입력해주세요.");
            return;
        }

        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        try {
            const response = await fetch(`/hometop/api/inquiries/${id}/respond`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(csrfHeader && {[csrfHeader]: csrfToken})
                },
                body: JSON.stringify({ "answer": answerText })
            });

            if (response.ok) {
                alert("답변이 등록되었습니다.");
                location.reload(); // 새로고침하여 답변 확인
            } else {
                alert("답변 등록에 실패했습니다.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }
</script>
</body>
</html>
