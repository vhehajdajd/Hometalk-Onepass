
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='문의 내용')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>
        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">

            <main class="container">
                <div class="post-header mt-lg">
                    <div class="flex-between">
                        <span class="category" th:text="${complaint.category}">카테고리</span>
                        <span class="badge"
                              th:text="${complaint.status}"
                              th:classappend="${complaint.status == '처리완료'} ? 'status-complete' : 'status-waiting' ">상태</span>
                    </div>

                    <h1 lass="title mt-sm" th:text="${complaint.title}">민원 제목</h1>

                    <div class="post-info text-muted mt-sm">
                        <span th:text="|작성자 ID: ${complaint.userId}|">작성자</span>
                        <span th:text="${complaint.createdAt != null ? #temporals.format(complaint.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">작성일</span>
                    </div>
                </div>

                <div class="post-content">
                    <div class="content-body" th:utext="${complaint.content}">민원 내용</div>

                    <div th:if="${complaint.attachments != null and not #lists.isEmpty(complaint.attachments)}" class="attachments mt-lg" style="margin-top: 30px;">
                        <p class="sub-title">📎 첨부파일</p>
                        <ul class="mt-sm">
                            <li th:each="file : ${complaint.attachments}">
                                <a th:href="@{/hometop/inquiries/download(fileName=${file.storedFileName})}"
                                   th:text="${file.originFileName}"
                                   class="text-small" style="color: var(--color-sub); text-decoration: underline;">
                                    파일명
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div th:if="${complaint.answer != null}" class="admin-answer-section">
                    <h4 class="sub-title">✉️ 관리자 답변</h4>
                    <p th:text="${complaint.answer}" class="answer-box mt-sm">답변 내용</p>
                </div>

                <div class="post-footer flex-between mt-lg pt-lg">
                    <a th:href="@{/hometop/inquiries/list}" class="btn btn-outline">>목록으로</a>

                    <div class="auth-buttons flex" style="gap: var(--spacing-sm);">
                        <a th:href="@{/hometop/inquiries/edit/{id}(id=${complaint.id})}" class="btn btn-primary">수정</a>
                        <button type="button" class="btn btn-danger-outline" th:onclick="|confirmDelete(${complaint.id})|">삭제</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

<script th:inline="javascript">
    function confirmDelete(id) {
        if (confirm("정말로 이 문의글을 삭제하시겠습니까?")) {
            location.href = "/hometop/inquiries/delete/" + id;
        }
    }
</script>
</body>
</html>
