<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='민원 작성')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>

        <div class="dashboard-content">
            <main class="container">
                <h2 class="title">민원 등록</h2>

                <form id="writeForm" enctype="multipart/form-data" class="write-form">
                    <!-- 비밀글 설정 -->
                    <div class="form-group mb-md">
                        <label>
                            <input type="checkbox" id="secretCheckbox" name="secret" value="true">
                            비밀글 설정
                        </label>
                        <p class="text-muted">* 비밀글은 작성자와 관리자만 볼 수 있습니다.</p>
                    </div>

                    <div class="flex gap-md mb-md">
                        <div class="form-group category-group">
                            <label for="category" class="form-label">분류</label>
                            <select name="category" id="category" class="input-field select-field">
                                <option value="시설/기술">시설/기술</option>
                                <option value="환경/위생">환경/위생</option>
                                <option value="보안/안전">보안/안전</option>
                                <option value="기타문의">기타문의</option>
                            </select>
                        </div>

                        <div class="form-group title-group">
                            <label for="title" class="form-label">제목</label>
                            <input type="text" id="title" name="title" class="input-field" placeholder="제목을 입력하세요" required>
                        </div>
                    </div>

                    <div class="form-group mb-md">
                        <label for="content" class="form-label">내용</label>
                        <textarea id="content" name="content" class="input-field textarea-field" placeholder="내용을 상세히 입력해주세요" required></textarea>
                    </div>

                    <div class="form-group mb-xl">
                        <label class="form-label">첨부파일</label>
                        <div class="file-upload-wrapper">
                            <input type="file"
                                   id="files"
                                   name="files"
                                   class="file-input"
                                   multiple
                                   onchange="handleFileSelect(event)"
                                   style="display: none;">

                            <button type="button" class="btn btn-outline" id="btn-add-file" onclick="document.getElementById('files').click()">
                                ➕ 파일 추가하기
                            </button>

                            <p class="file-hint mt-xs">* 이미지는 최대 3개까지 업로드 가능합니다.</p>

                            <div id="file-list-container" class="mt-sm"></div>
                        </div>
                    </div>

                    <div class="btn-area flex-center gap-md">
                        <a th:href="@{/complaints/list}" class="btn btn-outline">취소</a>
                        <button type="button" class="btn btn-primary" onclick="submitForm()">등록</button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    const csrfToken = /*[[${_csrf.token}]]*/ '';

    let selectedFiles = [];

    function handleFileSelect(event) {
        const input = event.target;
        const newFiles = Array.from(input.files);

        if (selectedFiles.length + newFiles.length > 3) {
            alert("파일은 최대 3개까지만 업로드 가능합니다.");
            input.value = "";
            return;
        }

        selectedFiles = [...selectedFiles, ...newFiles];
        input.value = "";

        renderFileList();
    }

    function renderFileList() {
        const container = document.getElementById('file-list-container');
        if (!container) return;

        container.innerHTML = "";

        selectedFiles.forEach((file, index) => {
            const fileItem = document.createElement('div');
            fileItem.className = "file-item";

            fileItem.innerHTML = `
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">(${(file.size / 1024).toFixed(1)} KB)</span>
                </div>
                <button type="button" class="btn-file-delete" onclick="removeFile(${index})">삭제</button>
            `;

            container.appendChild(fileItem);
        });
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    async function submitForm() {
        const form = document.getElementById("writeForm");
        const formData = new FormData(form);

        formData.delete("secret");
        const secretCheckbox = document.getElementById('secretCheckbox');
        formData.append('secret', secretCheckbox.checked);

        formData.delete("files");
        selectedFiles.forEach(file => {
            formData.append("files", file);
        });

        try {
            const response = await fetch('/hometop/api/complaints', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                },
                body: formData
            });

            if (!response.ok) {
                const text = await response.text();
                console.error('등록 실패:', response.status, text);

                if (response.status === 409) {
                    alert('이미 동일한 민원이 접수되었습니다. 잠시 후 다시 시도해주세요.');
                } else if (response.status === 401) {
                    alert('로그인이 필요합니다.');
                    location.href = '/hometop/auth';
                } else {
                    alert('등록 실패: ' + response.status);
                }

                return;
            }

            alert("성공적으로 등록되었습니다!");
            location.href = "/hometop/complaints/list";

        } catch (error) {
            console.error("Error:", error);
            alert("서버 연결 중 에러가 발생했습니다.");
        }
    }
</script>
</body>
</html>
