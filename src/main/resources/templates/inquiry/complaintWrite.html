
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='민원 작성')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>
        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">

            <main class="container">
                <h2 class="title">민원 등록</h2>

                <div class="form-group mb-md">
                    <label class="form-label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="isSecret" name="isSecret" style="width: 18px; height: 18px;">
                        <span>비밀글 설정</span>
                    </label>
                    <p class="text-muted" style="font-size: 13px; margin-left: 26px;">* 비밀글은 작성자와 관리자만 볼 수 있습니다.</p>
                </div>

                <form id="writeForm" enctype="multipart/form-data" class="write-form">
                    <div class="flex gap-md mb-md">
                        <!-- 분류 (너비를 작게 고정) -->
                        <div class="form-group" style="flex: 0 0 150px;">
                            <label for="category" class="form-label">분류</label>
                            <select name="category" id="category" class="input-field select-field">
                                <option value="시설/기술">시설/기술</option>
                                <option value="환경/위생">환경/위생</option>
                                <option value="보안/안전">보안/안전</option>
                                <option value="기타문의">기타문의</option>
                            </select>
                        </div>

                        <!-- 제목 (나머지 공간을 모두 차지) -->
                        <div class="form-group" style="flex: 1;">
                            <label for="title" class="form-label">제목</label>
                            <input type="text" id="title" name="title" class="input-field" placeholder="제목을 입력하세요" required>
                        </div>
                    </div>

                    <div class="form-group mb-md">
                        <label for="content" class="form-label">내용</label>
                        <textarea id="content" name="content" class="input-field textarea-field" placeholder="내용을 상세히 입력해주세요" required></textarea>
                    </div>

                    <div class="form-group mb-xl">
                        <label for="files" class="form-label">첨부파일</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="files" name="files" class="file-input" multiple>
                            <p class="file-hint mt-xs">* 이미지는 최대 3개까지 업로드 가능합니다.</p>
                        </div>
                    </div>

                    <div class="btn-area flex-center gap-md">
                        <a th:href="@{/complaints/list}" class="btn btn-outline">취소</a>
                        <button type="button" class="btn btn-primary" onclick="submitForm()">등록</button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</div>

<script th:inline="javascript">
        async function submitForm() {
        // 1. 값 추출 및 기본 유효성 검사
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const category = document.getElementById('category').value;
        const isSecret = document.getElementById('isSecret').checked;
        const fileInput = document.getElementById('files');

        if(!title || !content) {
            alert("제목과 내용을 입력해주세요.");
            return;
        }
        if (fileInput.files.length > 3) {
            alert("파일은 최대 3개까지만 첨부할 수 있습니다.");
            return;
        }

        const formData = new FormData();

        // [수정] 사용자 연동 전까지는 임시 ID(예: 1)를 사용합니다.
        const tempUserId = 1;

        // 2. DTO 생성 및 Blob 추가
        const complaintDto = {
            title: title,
            content: content,
            category: category,
            isSecret: isSecret,
            // userId: userId
            userId: tempUserId, // 💡 임시 ID 주입
            userName: "테스트유저"
        };
        formData.append("dto", new Blob([JSON.stringify(complaintDto)], { type: "application/json" }));

        // 3. 파일 추가
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append("files", fileInput.files[i]);
        }

        // 4. [중요] CSRF 토큰 추출
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        try {
            const response = await fetch('/hometop/api/complaints', {
            method: 'POST',
            headers: {
            // 헤더 이름과 값을 동적으로 매핑
            [csrfHeader]: csrfToken
            },
            body: formData
        });

        if (response.ok) {
            alert("성공적으로 등록되었습니다!");
            location.href = "/hometop/complaints/list";
        } else {
            const status = response.status;
            if(status === 403) {
            alert("권한이 없거나 보안 세션이 만료되었습니다. (403)");
            } else {
                alert("등록에 실패했습니다. (Error: " + status + ")");
            }
        }
        } catch (error) {
            console.error("Error:", error);
            alert("서버 연결 중 에러가 발생했습니다.");
        }
    }
</script>
</body>
</html>
