<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='문의 작성')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>

        <div class="dashboard-content">
            <main class="container">
                <h2 class="title">문의 등록</h2>

                <form id="writeForm" enctype="multipart/form-data" class="write-form">
                    <div class="flex gap-md mb-md">
                        <div class="form-group" style="flex: 0 0 150px;">
                            <label for="category" class="form-label">분류</label>
                            <select name="category" id="category" class="input-field select-field">
                                <option value="시설/기술">시설/기술</option>
                                <option value="환경/위생">환경/위생</option>
                                <option value="보안/안전">보안/안전</option>
                                <option value="기타문의">기타문의</option>
                            </select>
                        </div>

                        <div class="form-group" style="flex: 1;">
                            <label for="title" class="form-label">제목</label>
                            <input type="text" id="title" name="title" class="input-field" placeholder="제목을 입력하세요" required>
                        </div>
                    </div>

                    <div class="form-group mb-md">
                        <label for="content" class="form-label">내용</label>
                        <textarea id="content" name="content" class="input-field textarea-field" placeholder="내용을 상세히 입력해주세요" required></textarea>
                    </div>

                    <!-- 첨부파일 영역 -->
                    <div class="form-group mb-xl">
                        <label class="form-label">첨부파일</label>
                        <div class="file-upload-wrapper">
                            <!-- 실제 input은 숨기고 버튼으로 제어 -->
                            <input type="file" id="files" class="file-input" multiple onchange="handleFileSelect(event)" style="display: none;">

                            <button type="button" class="btn btn-outline" onclick="document.getElementById('files').click()">
                                ➕ 파일 추가하기
                            </button>

                            <p class="file-hint mt-xs">* 이미지는 최대 3개까지 업로드 가능합니다.</p>

                            <!-- 파일 목록이 출력될 컨테이너 -->
                            <div id="file-list-container" class="mt-sm"></div>
                        </div>
                    </div>

                    <div class="btn-area flex-center gap-md">
                        <a th:href="@{/inquiries/list}" class="btn btn-outline">취소</a>
                        <button type="button" class="btn btn-primary" onclick="submitForm()">등록</button>
                    </div>
                </form>
            </main>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // 1. 선택된 파일들을 담을 보관함
    let selectedFiles = [];

    // 2. 파일 선택 시 호출되는 함수
    function handleFileSelect(event) {
        const input = event.target;
        const newFiles = Array.from(input.files);

        // 개수 제한 체크 (기존 파일 + 새 파일)
        if (selectedFiles.length + newFiles.length > 3) {
            alert("파일은 최대 3개까지만 업로드 가능합니다.");
            input.value = "";
            return;
        }

        // 배열에 누적 저장
        selectedFiles = [...selectedFiles, ...newFiles];

        // input 초기화 (같은 파일을 다시 선택해도 반응하도록 함)
        input.value = "";

        renderFileList();
    }

    // 3. 화면에 파일 목록 그리기
    function renderFileList() {
        const container = document.getElementById('file-list-container');
        if(!container) return;

        container.innerHTML = "";

        selectedFiles.forEach((file, index) => {
            const fileItem = document.createElement('div');
            fileItem.className = "file-item"; // 지현님 CSS 파일에 정의된 스타일을 따릅니다.

            fileItem.innerHTML = `
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">(${(file.size / 1024).toFixed(1)} KB)</span>
                </div>
                <button type="button" class="btn-file-delete" onclick="removeFile(${index})">삭제</button>
            `;
            container.appendChild(fileItem);
        });
    }

    // 4. 리스트에서 파일 삭제
    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileList();
    }

    // 5. 서버 전송 함수
    async function submitForm() {
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const category = document.getElementById('category').value;

        if(!title || !content) {
            alert("제목과 내용을 입력해주세요.");
            return;
        }

        const formData = new FormData();

        // 텍스트 데이터 추가
        formData.append("title", title);
        formData.append("content", content);
        formData.append("category", category);

        // 보관함(selectedFiles)에 있는 파일들을 추가
        selectedFiles.forEach(file => {
            formData.append("files", file);
        });

        // CSRF 토큰 추출
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        try {
            const response = await fetch('/hometop/api/inquiries', {
                method: 'POST',
                headers: csrfToken && csrfHeader ? {
                    [csrfHeader]: csrfToken
                } : {},
                body: formData,
                credentials: 'same-origin'
            });

            if (response.ok) {
                alert("성공적으로 등록되었습니다!");
                location.href = "/hometop/inquiries/list";
            } else {
                const status = response.status;
                if(status === 403) {
                    alert("권한이 없거나 보안 세션이 만료되었습니다. (403)");
                } else if (status === 401) {
                    alert("세션이 만료되었습니다. 다시 로그인해주세요.");
                    location.href = "/hometop/auth";
                } else {
                    alert("등록에 실패했습니다. (Error: " + status + ")");
                }
            }
        } catch (error) {
            console.error("Error:", error);
            alert("서버 연결 중 에러가 발생했습니다.");
        }
    }
</script>
</body>
</html>
