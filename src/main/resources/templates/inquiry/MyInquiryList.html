
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='내 문의 내역')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>
        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">
            <main class="container">
                <h2 class="title">내 문의</h2>

                <table class="table">
                    <thead>
                    <tr>
                        <th>카테고리</th>
                        <th>제목</th>
                        <th>처리상태</th>
                        <th>작성일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="my : ${paging.content}">
                        <td th:text="${my.category}"></td>
                        <td class="title-cell">
                            <a th:href="@{/inquiries/detail/{id}(id=${my.id})}" th:text="${my.title}"></a>
                        </td>
                        <td class="text-small badge" th:text="${my.status}"></td>
                        <td class="text-muted" th:text="${#temporals.format(my.createdAt, 'yyyy-MM-dd')}"></td>
                    </tr>
                    <tr th:if="${paging.isEmpty()}">
                        <td colspan="4" style="text-align: center; padding: 50px 0;">작성한 문의가 없습니다.</td>
                    </tr>
                    </tbody>
                </table>

                <div class="pagination-container">
                    <!-- 가운데 페이징 버튼 -->
                    <nav class="pagination-nav">
                        <ul class="pagination" th:if="${!paging.isEmpty()}">

                            <!-- 이전 페이지 -->
                            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                                <a class="page-link" th:href="@{|?page=${paging.number - 1}|}" aria-label="Previous">
                                    &laquo;
                                </a>
                            </li>

                            <!-- 페이지 번호 루프 -->
                            <li class="page-item"
                                th:each="page: ${#numbers.sequence(0, paging.totalPages - 1)}"
                                th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
                                th:classappend="${page == paging.number} ? 'active'">
                                <a class="page-link" th:text="${page + 1}" th:href="@{|?page=${page}|}"></a>
                            </li>

                            <!-- 다음 페이지 -->
                            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                                <a class="page-link" th:href="@{|?page=${paging.number + 1}|}" aria-label="Next">
                                    &raquo;
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <!-- 오른쪽 버튼 영역 (CSS의 action-wrapper 활용) -->
                    <div class="action-wrapper">
                        <a th:href="@{/inquiries}" class="btn btn-outline">전체 목록</a>
                    </div>
                </div>
            </main>

        </div>
    </div>
</div>

</body>
</html>
