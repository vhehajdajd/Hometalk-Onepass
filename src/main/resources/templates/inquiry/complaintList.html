<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='민원 게시판')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>

    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>

        <div class="dashboard-content">
            <main class="container">
                <h2 class="title">민원 게시판</h2>

                <table class="table mt-md">
                    <colgroup>
                        <col style="width: 120px">
                        <col style="width: auto">
                        <col style="width: 120px">
                        <col style="width: 120px">
                        <col style="width: 140px">
                    </colgroup>

                    <thead>
                    <tr>
                        <th>카테고리</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>상태</th>
                        <th>작성일</th>
                    </tr>
                    </thead>

                    <tbody th:if="${paging != null}">
                    <tr th:each="list : ${paging.content}">
                        <td>
                            <span class="badge category-badge" th:text="${list.category}">시설/기술</span>
                        </td>

                        <td class="title-cell">
                            <span th:if="${list.secret}" style="margin-right: 4px;">🔒</span>

                            <a th:if="${list.canView}"
                               th:href="@{/complaints/detail/{id}(id=${list.id})}"
                               th:text="${list.title}">
                                민원 제목
                            </a>

                            <span th:unless="${list.canView}">
                                비밀글입니다
                            </span>
                        </td>

                        <td th:text="${list.userName}">작성자</td>

                        <td>
                            <span th:if="${list.status != null}"
                                  class="badge"
                                  th:classappend="${list.status.cssClass}"
                                  th:text="${list.status.description}">
                                상태
                            </span>

                            <span th:if="${list.status == null}" class="badge">
                                데이터 오류
                            </span>
                        </td>

                        <td class="text-muted"
                            th:text="${#temporals.format(list.createdAt, 'yyyy-MM-dd')}">
                            2026-05-07
                        </td>
                    </tr>

                    <tr th:if="${paging.isEmpty()}">
                        <td colspan="5"
                            class="text-muted"
                            style="padding: 100px 0; text-align: center;">
                            등록된 민원 내역이 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="pagination-container mt-lg">
                    <nav class="pagination-nav">
                        <ul class="pagination" th:if="${paging != null and !paging.isEmpty()}">

                            <li class="page-item"
                                th:classappend="${!paging.hasPrevious()} ? 'disabled' : ''">
                                <a class="page-link"
                                   th:href="@{/complaints/list(page=${paging.number - 1})}">
                                    &laquo;
                                </a>
                            </li>

                            <li class="page-item"
                                th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                                th:if="${page >= paging.number - 2 and page <= paging.number + 2}"
                                th:classappend="${page == paging.number} ? 'active' : ''">
                                <a class="page-link"
                                   th:text="${page + 1}"
                                   th:href="@{/complaints/list(page=${page})}">
                                    1
                                </a>
                            </li>

                            <li class="page-item"
                                th:classappend="${!paging.hasNext()} ? 'disabled' : ''">
                                <a class="page-link"
                                   th:href="@{/complaints/list(page=${paging.number + 1})}">
                                    &raquo;
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <div class="action-wrapper">
                        <a th:href="@{/complaints/write}" class="btn btn-primary">글 작성</a>
                    </div>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
</body>
</html>
