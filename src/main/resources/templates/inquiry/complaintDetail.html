<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='민원 내용')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">

</head>

<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>

    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>

        <div class="dashboard-content">
            <main class="container">

                <div class="post-header">
                    <div class="flex-between">
                        <span class="badge category-badge" th:text="${complaint.category}">카테고리</span>

                        <div th:if="${complaint != null and complaint.status != null}">
                            <span class="badge"
                                  th:classappend="${complaint.status.cssClass}"
                                  th:text="${complaint.status.description}">
                                상태
                            </span>
                        </div>
                    </div>

                    <h1 class="title mt-sm" th:text="${complaint.title}">민원 제목</h1>

                    <div class="post-info text-muted mt-sm">
                        <span th:text="${complaint.secret and !complaint.canView ? '비공개' : complaint.userName}">
                            작성자명
                        </span>
                        <span> 작성자</span>

                        <span class="divider">|</span>

                        <span th:text="${complaint.createdAt != null ? #temporals.format(complaint.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                            작성일
                        </span>
                    </div>
                </div>

                <div class="post-content">
                    <div class="content-body"
                         th:text="${complaint.secret and !complaint.canView ? '🔒 비밀글입니다.' : complaint.content}"
                         style="min-height: 200px; white-space: pre-wrap;">
                        내용
                    </div>

                    <div th:if="${complaint.attachments != null and !#lists.isEmpty(complaint.attachments) and (not complaint.secret or complaint.canView)}"
                         class="attachments mt-lg">
                        <p class="sub-title">📎 첨부파일</p>

                        <div class="attachment-list mt-sm">
                            <div th:each="file : ${complaint.attachments}" class="attachment-item">
                                <img th:src="@{/api/complaints/file/display(fileName=${file.storedFileName})}"
                                     class="img-preview mb-xs">

                                <a th:href="@{/api/complaints/file/download(fileName=${file.storedFileName}, originName=${file.originFileName})}"
                                   th:text="${file.originFileName}"
                                   class="text-small"
                                   style="word-break: break-all; color: var(--color-sub);">
                                    파일명
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${complaint.answers != null and !#lists.isEmpty(complaint.answers) and (not complaint.secret or complaint.canView)}"
                     class="admin-answer-section mt-lg">
                    <h4 class="sub-title">✉️ 관리자 답변</h4>

                    <div th:each="answer : ${complaint.answers}" class="answer-box mt-sm">
                        <div class="text-muted text-small">
                            <span th:text="${answer.writerName}">관리자</span>
                            <span> | </span>
                            <span th:text="${answer.createdAt != null ? #temporals.format(answer.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                                작성일
                            </span>
                        </div>

                        <div th:text="${answer.content}"
                             style="white-space: pre-wrap; margin-top: 8px;">
                            답변 내용
                        </div>
                    </div>
                </div>

                <div th:if="${complaint != null and complaint.isAdmin}" class="admin-answer-form mt-xl pt-lg">
                    <h3 class="sub-title" style="margin-top: 20px;">관리자 답변 등록</h3>

                    <div class="mt-sm">
                        <textarea id="adminResponse"
                                  name="response"
                                  rows="5"
                                  class="input-field"
                                  placeholder="여기에 답변을 입력하세요..."></textarea>

                        <div class="flex-end mt-sm">
                            <button type="button"
                                    class="btn btn-primary"
                                    id="responseBtn"
                                    th:data-id="${complaint.id}">
                                답변 저장하기
                            </button>
                        </div>
                    </div>

                    <div class="flex-end mt-md">
                        <button type="button"
                                class="btn btn-success"
                                id="completeBtn"
                                th:data-id="${complaint.id}">
                            민원 해결 완료
                        </button>
                    </div>
                </div>

                <div class="post-footer flex-between mt-xl">
                    <a th:href="@{/complaints/list}" class="btn btn-outline">목록으로</a>

                    <div th:if="${complaint.canEdit}">
                        <button type="button"
                                class="btn btn-danger-outline"
                                id="deleteBtn"
                                th:data-id="${complaint.id}">
                            삭제
                        </button>
                    </div>
                </div>

            </main>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const responseBtn = document.getElementById('responseBtn');
        const completeBtn = document.getElementById('completeBtn');
        const deleteBtn = document.getElementById('deleteBtn');

        if (responseBtn) {
            responseBtn.addEventListener('click', function () {
                submitResponse(this.dataset.id);
            });
        }

        if (completeBtn) {
            completeBtn.addEventListener('click', function () {
                completeComplaint(this.dataset.id);
            });
        }

        if (deleteBtn) {
            deleteBtn.addEventListener('click', function () {
                confirmDelete(this.dataset.id);
            });
        }
    });

    async function confirmDelete(id) {
        if (!confirm("정말로 삭제하시겠습니까?")) return;

        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const headers = {};
        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        const response = await fetch(`/hometop/api/complaints/${id}`, {
            method: 'DELETE',
            headers: headers
        });

        if (response.ok) {
            alert("삭제되었습니다.");
            location.href = "/hometop/complaints/list";
        } else {
            alert("삭제 실패");
        }
    }

    async function submitResponse(id) {
        const textarea = document.getElementById('adminResponse');
        const answerText = textarea.value;

        if (!answerText.trim()) {
            alert("답변 내용을 입력해주세요.");
            return;
        }

        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const headers = {
            'Content-Type': 'application/json'
        };

        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        try {
            const response = await fetch(`/hometop/api/complaints/${id}/respond`, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ answer: answerText })
            });

            if (response.ok) {
                alert("답변이 등록되었습니다.");
                location.reload();
            } else {
                alert("답변 등록에 실패했습니다.");
            }
        } catch (error) {
            console.error(error);
            alert("답변 등록 중 오류가 발생했습니다.");
        }
    }

    async function completeComplaint(id) {
        if (!confirm("이 민원을 해결 완료 처리하시겠습니까?")) return;

        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const headers = {};
        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        const response = await fetch(`/hometop/api/complaints/${id}/complete`, {
            method: 'POST',
            headers: headers
        });

        if (response.ok) {
            alert("민원이 완료 처리되었습니다.");
            location.reload();
        } else {
            alert("처리에 실패했습니다.");
        }
    }
</script>
</body>
</html>
