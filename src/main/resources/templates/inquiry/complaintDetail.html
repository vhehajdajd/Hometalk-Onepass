
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='민원 내용')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='inquiry')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'inquiry'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: inquiry}"></div>
        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">

            <main class="container">
                <div class="post-header">
                    <div class="flex-between">
                        <span class="badge category-badge" th:text="${complaint.category}">카테고리</span>
                        <span class="badge"
                              th:classappend="${complaint.status == '처리완료' ? 'status-complete' : 'status-waiting'}"
                              th:text="${complaint.status}">상태</span>
                    </div>

                    <h1 class="title mt-sm" th:text="${complaint.title}">민원 제목</h1>

                    <div class="post-info text-muted mt-sm">
                        <span th:text="|작성자 ID: ${complaint.userId}|">작성자</span>
                        <span class="divider">|</span>
                        <span th:text="${complaint.createdAt != null ? #temporals.format(complaint.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">작성일</span>
                    </div>
                </div>

                <div class="post-content">
                    <div class="content-body" th:utext="${complaint.content}">내용이 출력됩니다.</div>

                    <!-- 첨부파일 (이미지 미리보기 및 다운로드) -->
                    <div th:if="${not #lists.isEmpty(complaint.attachments)}" class="attachments mt-lg">
                        <p class="sub-title">📎 첨부파일</p>
                        <div class="attachment-list mt-sm">
                            <div th:each="file : ${complaint.attachments}" class="attachment-item">
                                <img th:src="@{/api/complaints/display(fileName=${file.storedFileName})}" class="img-preview mb-xs">
                                <a th:href="@{/api/complaints/download/{id}(id=${file.id})}" th:text="${file.originFileName}" class="text-small">파일명</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${complaint.answer != null}" class="admin-answer-section">
                    <h4 class="sub-title">✉️ 관리자 답변</h4>
                    <div class="answer-box mt-sm" th:text="${complaint.answer}">답변 내용</div>
                </div>

                <!-- 관리자 전용 답변 등록 폼 -->
                <div class="admin-only admin-answer-form mt-xl pt-lg">
                    <h3 class="sub-title">관리자 답변 등록</h3>
                    <form th:action="@{/api/complaints/{id}/respond(id=${complaint.id})}" method="post" class="mt-sm">
                        <textarea name="response" rows="5" class="input-field" placeholder="여기에 답변을 입력하세요..."></textarea>
                        <div class="flex-end mt-sm">
                            <button type="submit" class="btn btn-primary">답변 저장하기</button>
                        </div>
                    </form>
                </div>

                <div class="post-footer flex-between mt-xl">
                    <a th:href="@{/complaints/list}" class="btn btn-outline">목록으로</a>
                    <div class="auth-buttons">
                        <a th:href="@{/complaints/edit/{id}(id=${complaint.id})}" class="btn btn-primary">수정</a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
</body>
</html>
