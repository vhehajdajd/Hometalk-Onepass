<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('대시보드')}"></head>
<style>
    /* ── 일정 모달 ── */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(15,23,42,0.45);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }
    .modal-box {
        background: #fff;
        border-radius: 4px;
        width: 500px;
        max-width: 94%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        animation: modalIn 0.18s ease;
    }
    @keyframes modalIn {
        from { opacity: 0; transform: translateY(-14px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 24px;
        border-bottom: 2px solid var(--color-modal-line);
        font-weight: 600;
        font-size: 16px;
        color: var(--color-main);
        background: #f8fafc;
        border-radius: 4px 4px 0 0;
    }
    .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #94a3b8; }
    .modal-close:hover { color: var(--color-text); }
    .modal-body { padding: 22px 24px; }
    .modal-table { width: 100%; border-collapse: collapse; }
    .modal-table tr { border-bottom: 1px solid #f0f3f8; }
    .modal-table tr:last-child { border-bottom: none; }
    .modal-table td { padding: 10px 8px; font-size: 14px; vertical-align: middle; }
    .modal-label { color: #64748b; width: 90px; font-weight: 600; white-space: nowrap; }
    .detail-link { color: var(--color-main); font-weight: 600; text-decoration: none; }
    .detail-link:hover { text-decoration: underline; }
</style>
<body>

<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='home')}"></div>
    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths='home')}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: home}"></div>

        <div class="dashboard-content">
            <div class="dashboard-grid">

                <!-- 1행 -->
                <div class="row-1">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg>공지사항</span>
                            <a class="card-more" th:href="@{/notice}">더보기 &rsaquo;</a>
                        </div>
                        <div id="noticeList"><div class="loading">불러오는 중...</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg>커뮤니티 인기글</span>
                            <a class="card-more" th:href="@{/community/square/all}">더보기 &rsaquo;</a>
                        </div>
                        <div id="communityList"><div class="loading">불러오는 중...</div></div>
                    </div>
                </div>

                <!-- 2행 -->
                <div class="row-2">
                    <div class="card">
                        <div class="card-header">
                            <div class="cal-nav">
                                <button id="calPrev">&#8592;</button>
                                <span class="cal-nav-title" id="calTitle"></span>
                                <button id="calNext">&#8594;</button>
                            </div>
                            <a class="card-more" th:href="@{/schedule}">일정 보기 &rsaquo;</a>
                        </div>
                        <div class="cal-grid" id="calGrid"></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>오늘의 일정</span>
                            <a class="card-more" th:href="@{/schedule}">더보기 &rsaquo;</a>
                        </div>
                        <div id="todayScheduleList"><div class="loading">불러오는 중...</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/></svg>내 차량 현황</span>
                            <a class="card-more" th:href="@{/parking/vehicle}">더보기 &rsaquo;</a>
                        </div>
                        <div class="parking-section">
                            <div class="parking-section-title">차량 상태</div>
                            <div id="vehicleList"><div class="loading">불러오는 중...</div></div>
                        </div>
                        <div class="parking-section">
                            <div class="parking-section-title">잔여 티켓</div>
                            <div class="ticket-row">
                                <div class="ticket-box">
                                    <div class="ticket-label">1일권</div>
                                    <div class="ticket-count-wrap">
                                        <div class="ticket-count" id="dayTicket">-</div>
                                        <div class="ticket-unit">개</div>
                                    </div>
                                </div>
                                <div class="ticket-box">
                                    <div class="ticket-label">1시간권</div>
                                    <div class="ticket-count-wrap">
                                        <div class="ticket-count" id="hourTicket">-</div>
                                        <div class="ticket-unit">개</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3행 -->
                <div class="row-3">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>관리비</span>
                            <a class="card-more" th:href="@{/billing}">더보기 &rsaquo;</a>
                        </div>
                        <div id="billingContent"><div class="loading">불러오는 중...</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>예약 현황</span>
                            <a class="card-more" th:href="@{/reservation/apply}">더보기 &rsaquo;</a>
                        </div>
                        <div id="reservationList"><div class="loading">불러오는 중...</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>문의</span>
                            <a class="card-more" th:href="@{/hometop/inquiries/list}">더보기 &rsaquo;</a>
                        </div>
                        <div id="inquiryList"><div class="loading">불러오는 중...</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:5px;"><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M21.34 15.664a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><path d="M8 22H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>민원</span>
                            <a class="card-more" th:href="@{/complaints/list}">더보기 &rsaquo;</a>
                        </div>
                        <div id="complaintList"><div class="loading">불러오는 중...</div></div>
                    </div>
                </div>

            </div>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<!-- 일정 상세 모달 -->
<div class="modal-overlay" id="scheduleDetailModal" onclick="if(event.target===this) closeScheduleModal()">
    <div class="modal-box">
        <div class="modal-header">
            <span>일정 상세</span>
            <button class="modal-close" onclick="closeScheduleModal()">✕</button>
        </div>
        <div class="modal-body">
            <table class="modal-table">
                <tr><td class="modal-label">일정명</td><td id="modalTitle"></td></tr>
                <tr><td class="modal-label">분류</td><td id="modalBadge"></td></tr>
                <tr><td class="modal-label">시작</td><td id="modalStart"></td></tr>
                <tr id="modalEndRow"><td class="modal-label">종료</td><td id="modalEnd"></td></tr>
                <tr id="modalInfoRow"><td class="modal-label">설명</td><td id="modalInfo"></td></tr>
                <tr id="modalLocationRow"><td class="modal-label">장소</td><td id="modalLocation"></td></tr>
                <tr id="modalNoticeRow"><td class="modal-label">공지</td><td><a id="modalNoticeLink" href="#" class="detail-link">안내 페이지 이동 →</a></td></tr>
            </table>
        </div>
    </div>
</div>

<!-- 날짜별 일정 목록 모달 -->
<div class="modal-overlay" id="dayScheduleModal" onclick="if(event.target===this) closeDayModal()">
    <div class="modal-box">
        <div class="modal-header">
            <span id="dayModalTitle">일정 목록</span>
            <button class="modal-close" onclick="closeDayModal()">✕</button>
        </div>
        <div class="modal-body" id="dayModalBody"></div>
    </div>
</div>

<script th:inline="javascript">
    var contextPath = /*[[@{/}]]*/ '/';
</script>
<script>
    var today             = new Date();
    var calYear           = today.getFullYear();
    var calMonth          = today.getMonth() + 1;
    var scheduleData      = [];
    var todayScheduleData = [];

    var BADGE_LABEL = { 'FACILITY': '시설', 'SAFETY': '안전', 'NORMAL': '일반' };

    // ── 유틸 함수 ────────────────────────────────────────────────────────────
    function formatDate(str)     { return str ? str.substring(0, 10) : ''; }
    function formatTime(str)     { return str ? str.substring(11, 16) : ''; }
    function formatDateTime(str) { if (!str) return '-'; return str.substring(0,10) + ' ' + str.substring(11,16); }
    function comma(n)            { return n != null ? n.toLocaleString() : '-'; }
    function badgeLabel(b)       { return b==='FACILITY'?'시설':b==='SAFETY'?'안전':b==='NORMAL'?'일반':(b||''); }

    function getStatusClass(status) {
        if (!status) return 's-received';
        if (['확정','승인완료','답변완료'].includes(status)) return 's-answered';
        if (['승인대기','접수완료'].includes(status))        return 's-pending';
        if (status === '확인중') return 's-processing';
        if (status === '미답변') return 's-unanswered';
        if (status === '이용중') return 's-confirmed';
        return 's-received';
    }

    // ── 일정 상세 모달 ───────────────────────────────────────────────────────
    function openScheduleModal(id) {
        var s = todayScheduleData.find(function(s) { return s.id === id; });
        if (!s) return;
        document.getElementById('modalTitle').textContent = s.title;
        document.getElementById('modalBadge').textContent = s.badge ? (BADGE_LABEL[s.badge] || s.badge) : '-';
        document.getElementById('modalStart').textContent = formatDateTime(s.startAt);
        var endRow = document.getElementById('modalEndRow');
        if (s.endAt) {
            document.getElementById('modalEnd').textContent = formatDateTime(s.endAt);
            endRow.style.display = '';
        } else {
            endRow.style.display = 'none';
        }
        document.getElementById('modalInfoRow').style.display     = 'none';
        document.getElementById('modalLocationRow').style.display = 'none';
        document.getElementById('modalNoticeRow').style.display   = 'none';
        document.getElementById('scheduleDetailModal').style.display = 'flex';
    }
    function closeScheduleModal() {
        document.getElementById('scheduleDetailModal').style.display = 'none';
    }

    // ── 날짜별 일정 목록 모달 ────────────────────────────────────────────────
    function openDayModal(day) {
        var daySch = scheduleData.filter(function(s) {
            var cellDate = new Date(calYear, calMonth - 1, day);
            var sd = new Date(s.startAt);
            var ed = s.endAt ? new Date(s.endAt) : sd;
            cellDate.setHours(0,0,0,0); sd.setHours(0,0,0,0); ed.setHours(0,0,0,0);
            return cellDate >= sd && cellDate <= ed;
        });
        if (!daySch.length) return;

        document.getElementById('dayModalTitle').textContent =
            calYear + '년 ' + calMonth + '월 ' + day + '일 일정';

        document.getElementById('dayModalBody').innerHTML = daySch.map(function(s) {
            var badge   = s.badge || 'DEFAULT';
            var timeStr = formatTime(s.startAt);
            if (s.endAt) timeStr += ' ~ ' + formatTime(s.endAt);
            return '<div class="today-schedule-item">' +
                '<span class="today-schedule-badge ' + badge + '">' + badgeLabel(s.badge) + '</span>' +
                '<span class="today-schedule-title">' + s.title + '</span>' +
                '<span class="today-schedule-time">' + timeStr + '</span>' +
            '</div>';
        }).join('');

        document.getElementById('dayScheduleModal').style.display = 'flex';
    }
    function closeDayModal() {
        document.getElementById('dayScheduleModal').style.display = 'none';
    }

    // ── 렌더링 함수 ──────────────────────────────────────────────────────────
    function renderNotice(data) {
        var el = document.getElementById('noticeList');
        if (!data || !data.length) { el.innerHTML = '<div class="loading">공지가 없습니다.</div>'; return; }
        el.innerHTML = data.map(function(n) {
            return '<a class="notice-item" href="' + contextPath + 'notice/' + n.id + '">' +
                '<span class="notice-badge ' + n.badge + '">' + badgeLabel(n.badge) + '</span>' +
                '<span class="notice-title">' + n.title + '</span>' +
                '<span class="notice-date">' + formatDate(n.createdAt) + '</span></a>';
        }).join('');
    }

    function renderCommunity(data) {
        var el = document.getElementById('communityList');
        if (!data || !data.length) { el.innerHTML = '<div class="loading">게시글이 없습니다.</div>'; return; }
        el.innerHTML = data.map(function(c) {
            var boardCode = c.boardCode || 'square';
            var postId    = c.postId || c.id;
            return '<a class="community-item" href="' + contextPath + 'community/' + boardCode + '/' + c.categoryCode + '/' + postId + '">' +
                '<span class="community-badge">' + c.categoryName + '</span>' +
                '<span class="community-title">' + c.title + '</span></a>';
        }).join('');
    }

    function renderTodaySchedule(data) {
        var el = document.getElementById('todayScheduleList');
        if (!data || !data.length) { el.innerHTML = '<div class="loading">오늘 일정이 없습니다.</div>'; return; }
        el.innerHTML = data.map(function(s) {
            var badge   = s.badge || 'DEFAULT';
            var timeStr = formatTime(s.startAt);
            if (s.endAt) timeStr += ' ~ ' + formatTime(s.endAt);
            return '<div class="today-schedule-item" style="cursor:pointer;" onclick="openScheduleModal(' + s.id + ')">' +
                '<span class="today-schedule-badge ' + badge + '">' + badgeLabel(s.badge) + '</span>' +
                '<span class="today-schedule-title">' + s.title + '</span>' +
                '<span class="today-schedule-time">' + timeStr + '</span></div>';
        }).join('');
    }

    function renderBilling(data) {
        var el = document.getElementById('billingContent');
        if (!data) { el.innerHTML = '<div class="loading">정보 없음</div>'; return; }
        var st      = data.status === 'UNPAID' ? '미납' : '납부완료';
        var dateStr = data.dueDate ? data.dueDate : '-';
        el.innerHTML =
            '<div style="display:flex; justify-content:flex-end;">' +
                '<span class="billing-status-badge ' + data.status + '">' + st + '</span>' +
            '</div>' +
            '<div class="billing-card-row-wrap">' +
                '<div class="billing-card-row">' +
                    '<span class="billing-card-row-label">' + (data.billingMonth || '-') + ' 관리비</span>' +
                    '<span class="billing-card-row-value">' + comma(data.totalAmount) + '원</span>' +
                '</div>' +
                '<div class="billing-card-row">' +
                    '<span class="billing-card-row-label">납부기한</span>' +
                    '<span class="billing-card-row-value">' + dateStr + '</span>' +
                '</div>' +
            '</div>';
    }

    function renderVehicle(data) {
        var el = document.getElementById('vehicleList');
        if (!data || !data.length) { el.innerHTML = '<div class="loading">등록된 차량 없음</div>'; return; }
        el.innerHTML = data.slice(0, 3).map(function(v) {
            var status = v.status || '';
            var style, label;
            if (status === 'APPROVED' || status === '승인완료') {
                style = 'background:#e6f4f5; color:#2a9da4;';
                label = '승인완료';
            } else if (status === 'PENDING' || status === '승인대기') {
                style = 'background:#fff8e1; color:#b8860b;';
                label = '승인대기';
            } else {
                style = 'background:#fdecea; color:#EB6E57;';
                label = '반려';
            }
            return '<div class="parking-vehicle-item"><span>' + (v.carNumber || v.vehicleNumber || '-') + '</span>' +
                '<span class="parking-status" style="' + style + '">' + label + '</span></div>';
        }).join('');
    }

    function renderTicket(data) {
        if (!data) return;
        if (Array.isArray(data)) {
            var dayCount  = 0;
            var hourCount = 0;
            data.forEach(function(t) {
                if (t.ticketType === 'DAY'  || t.type === 'DAY')  dayCount  += (t.remainCount || t.totalCount || 0);
                if (t.ticketType === 'HOUR' || t.type === 'HOUR') hourCount += (t.remainCount || t.totalCount || 0);
            });
            document.getElementById('dayTicket').textContent  = dayCount;
            document.getElementById('hourTicket').textContent = hourCount;
        } else {
            document.getElementById('dayTicket').textContent  = data.dayTicket  != null ? data.dayTicket  : '-';
            document.getElementById('hourTicket').textContent = data.hourTicket != null ? data.hourTicket : '-';
        }
    }

    // ── 달력 렌더링 ──────────────────────────────────────────────────────────
    function renderCalendar() {
        document.getElementById('calTitle').textContent = calYear + '년 ' + calMonth + '월';
        var grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(function(d, i) {
            var div = document.createElement('div');
            div.className = 'cal-day-header' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
            div.textContent = d;
            grid.appendChild(div);
        });

        var firstDay = new Date(calYear, calMonth - 1, 1).getDay();
        var lastDate = new Date(calYear, calMonth, 0).getDate();
        var prevLast = new Date(calYear, calMonth - 1, 0).getDate();
        var cells    = [];

        for (var i = 0; i < firstDay; i++) cells.push({ day: prevLast - firstDay + 1 + i, other: true });
        for (var d = 1; d <= lastDate; d++) cells.push({ day: d, other: false });
        var remain = cells.length % 7 === 0 ? 0 : 7 - (cells.length % 7);
        for (var k = 1; k <= remain; k++) cells.push({ day: k, other: true });

        cells.forEach(function(cell) {
            var div = document.createElement('div');
            div.className = 'cal-cell' + (cell.other ? ' other-month' : '');
            var isToday = !cell.other && cell.day === today.getDate()
                       && calMonth === today.getMonth() + 1
                       && calYear  === today.getFullYear();
            if (isToday) div.classList.add('today');

            var dateDiv = document.createElement('div');
            dateDiv.className = 'cal-date';
            dateDiv.textContent = cell.day;
            div.appendChild(dateDiv);

            if (!cell.other) {
                var daySch = scheduleData.filter(function(s) {
                    var cellDate = new Date(calYear, calMonth - 1, cell.day);
                    var sd = new Date(s.startAt);
                    var ed = s.endAt ? new Date(s.endAt) : sd;
                    cellDate.setHours(0,0,0,0); sd.setHours(0,0,0,0); ed.setHours(0,0,0,0);
                    return cellDate >= sd && cellDate <= ed;
                });
                if (daySch.length > 0) {
                    var dotsDiv = document.createElement('div');
                    dotsDiv.className = 'cal-dots';
                    daySch.slice(0, 3).forEach(function(s) {
                        var dot = document.createElement('div');
                        dot.className = 'cal-dot ' + (s.badge || 'DEFAULT');
                        dotsDiv.appendChild(dot);
                    });
                    div.appendChild(dotsDiv);
                    // 일정 있는 날짜 클릭 시 모달
                    div.style.cursor = 'pointer';
                    (function(d) {
                        div.addEventListener('click', function() { openDayModal(d); });
                    })(cell.day);
                }
            }
            grid.appendChild(div);
        });
    }

    function loadCalendarSchedules() {
        fetch(contextPath + 'schedule/api/list?year=' + calYear + '&month=' + calMonth)
            .then(function(res) { return res.json(); })
            .then(function(data) { scheduleData = data; renderCalendar(); })
            .catch(function() { renderCalendar(); });
    }

    document.getElementById('calPrev').addEventListener('click', function() {
        calMonth--; if (calMonth < 1) { calMonth = 12; calYear--; }
        loadCalendarSchedules();
    });
    document.getElementById('calNext').addEventListener('click', function() {
        calMonth++; if (calMonth > 12) { calMonth = 1; calYear++; }
        loadCalendarSchedules();
    });

    // ── API 호출 ─────────────────────────────────────────────────────────────

    // 공지사항
    fetch(contextPath + 'notice/api/detail')
        .then(function(res) { return res.json(); })
        .then(function(data) { renderNotice(data); })
        .catch(function() { document.getElementById('noticeList').innerHTML = '<div class="loading">불러오기 실패</div>'; });

    // 커뮤니티 인기글
    fetch(contextPath + 'api/community/popular')
        .then(function(res) { return res.json(); })
        .then(function(data) { renderCommunity(data); })
        .catch(function() { document.getElementById('communityList').innerHTML = '<div class="loading">불러오기 실패</div>'; });

    // 오늘의 일정
    fetch(contextPath + 'schedule/api/calendar')
        .then(function(res) { return res.json(); })
        .then(function(data) { todayScheduleData = data; renderTodaySchedule(data); })
        .catch(function() { document.getElementById('todayScheduleList').innerHTML = '<div class="loading">불러오기 실패</div>'; });

    // 달력 일정 초기 로드
    loadCalendarSchedules();

    // 관리비
    fetch(contextPath + 'api/billing/resident/summary')
        .then(function(res) { return res.json(); })
        .then(function(data) { renderBilling(data); })
        .catch(function() { document.getElementById('billingContent').innerHTML = '<div class="loading">불러오기 실패</div>'; });

    // 내 차량 목록
    fetch(contextPath + 'parking/vehicle/list')
        .then(function(res) { return res.json(); })
        .then(function(data) { renderVehicle(Array.isArray(data) ? data : (data.content || [])); })
        .catch(function() { document.getElementById('vehicleList').innerHTML = '<div class="loading">불러오기 실패</div>'; });

    // 잔여 티켓
    fetch(contextPath + 'parking/ticket/current')
        .then(function(res) { return res.json(); })
        .then(function(data) { renderTicket(data); })
        .catch(function() {
            document.getElementById('dayTicket').textContent  = '-';
            document.getElementById('hourTicket').textContent = '-';
        });

    // 예약 API 미구현 - 추후 연결
    document.getElementById('reservationList').innerHTML = '<div class="loading">불러오기 실패</div>';

    // 문의 API 미구현 - 추후 연결
    document.getElementById('inquiryList').innerHTML = '<div class="loading">불러오기 실패</div>';

    // 민원 API 미구현 - 추후 연결
    document.getElementById('complaintList').innerHTML = '<div class="loading">불러오기 실패</div>';
</script>
</body>
</html>
