<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 대기 | Home Talk One Pass</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #eef4f8;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }
        .status-box {
            width: min(420px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #d5dee8;
            border-radius: 8px;
            background: #fff;
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 0 0 24px; line-height: 1.6; color: #4b5563; }
        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #3c6abc;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main class="status-box">
    <h1>승인 대기 중입니다</h1>
    <p>관리자 승인 후 서비스를 이용할 수 있습니다.<br>승인이 완료되면 다음 로그인 시 안내됩니다.</p>
    <form th:action="@{/auth/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">로그아웃</button>
    </form>
</main>
</body>
</html>
