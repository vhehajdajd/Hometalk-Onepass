<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 대기 | Home Talk One Pass</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body class="auth-status-page">
<main class="auth-status-box">
    <h1 class="auth-title">승인 대기 중입니다</h1>
    <p>관리자 승인 후 서비스를 이용할 수 있습니다.<br>승인이 완료되면 다음 로그인 시 안내됩니다.</p>
    <form th:action="@{/auth/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="auth-btn auth-btn-block" type="submit">로그아웃</button>
    </form>
</main>
</body>
</html>
