<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 승인</title>
    <link rel="stylesheet" th:href="@{/css/notification/notification.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth/user-approvals.css}">
    <script th:src="@{/js/notification/notification-sse.js}"></script>
    <script th:src="@{/js/notification/notification-bell.js}"></script>
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='userApproval')}"></div>

    <div class="main-wrapper">
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths='approvals')}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: approvalAdmin}"></div>

        <main class="content">
            <div class="container">
                <section class="approval-page">
                    <div class="approval-head">
                        <div>
                            <h1>회원 승인</h1>
                            <p>가입 신청한 회원 정보를 확인하고 서비스 이용을 승인합니다.</p>
                        </div>
                        <span class="approval-count" th:text="${#lists.size(pendingUsers)} + '건 대기'">0건 대기</span>
                    </div>

                    <div class="approval-empty" th:if="${#lists.isEmpty(pendingUsers)}">
                        승인 대기 중인 회원이 없습니다.
                    </div>

                    <div class="approval-table-wrap" th:if="${!#lists.isEmpty(pendingUsers)}">
                        <table class="approval-table">
                            <thead>
                            <tr>
                                <th>회원</th>
                                <th>연락처</th>
                                <th>세대 정보</th>
                                <th>상태</th>
                                <th>처리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${pendingUsers}">
                                <td>
                                    <strong th:text="${user.name}">홍길동</strong>
                                    <span th:text="${user.nickname ?: '-'}">닉네임</span>
                                </td>
                                <td>
                                    <span th:text="${user.email}">email@example.com</span>
                                    <small th:text="${user.phoneNumber ?: '-'}">010-0000-0000</small>
                                </td>
                                <td>
                                    <span th:text="${user.buildingName ?: '-'}">가나다 아파트</span>
                                    <small th:text="${(user.dong ?: '-') + '동 / ' + (user.ho ?: '-') + '호 / ' + (user.postNum ?: '-')}">101 / 101 / 00000</small>
                                </td>
                                <td>
                                    <span class="approval-status" th:text="${user.status}">PENDING</span>
                                </td>
                                <td>
                                    <div class="approval-actions">
                                        <form th:action="@{/admin/users/{id}/approve(id=${user.userId})}" method="post" class="approval-form">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <select name="role" class="approval-role" aria-label="승인 역할 선택">
                                                <option value="RESIDENT">입주민</option>
                                                <option value="STAFF">직원</option>
                                            </select>
                                            <button type="submit" class="approval-btn approval-btn-approve">승인</button>
                                        </form>
                                        <form th:action="@{/admin/users/{id}/reject(id=${user.userId})}" method="post"
                                              onsubmit="return confirm('이 회원 가입을 거절하시겠습니까?')">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="approval-btn approval-btn-reject">거절</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
</body>
</html>
