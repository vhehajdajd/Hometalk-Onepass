<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 | Home talk</title>
    <link rel="stylesheet" th:href="@{/css/auth/my-page.css}">
</head>
<body class="mp-page">
<div class="mp-shell">
    <article class="mp-card">
        <header class="mp-head">
            <div>
                <p class="mp-auth" th:text="${myPage.authType}">일반 로그인</p>
                <h1 class="mp-title">내 회원 정보</h1>
            </div>
        </header>

        <main class="mp-content">
            <section class="mp-section">
                <h2 class="mp-section-title">기본 정보</h2>
                <dl class="mp-list">
                    <div class="mp-row">
                        <dt>이름</dt>
                        <dd th:text="${myPage.name ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>닉네임</dt>
                        <dd th:text="${myPage.nickname ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>이메일</dt>
                        <dd th:text="${myPage.email ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>전화번호</dt>
                        <dd th:text="${myPage.phoneNumber ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>소셜 플랫폼</dt>
                        <dd th:text="${myPage.socialPlatform ?: '-'}">-</dd>
                    </div>
                </dl>
            </section>

            <section class="mp-section">
                <h2 class="mp-section-title">세대 정보</h2>
                <dl class="mp-list">
                    <div class="mp-row">
                        <dt>주소</dt>
                        <dd th:text="${myPage.buildingName ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>동</dt>
                        <dd th:text="${myPage.dong ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>호</dt>
                        <dd th:text="${myPage.ho ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>우편번호</dt>
                        <dd th:text="${myPage.postNum ?: '-'}">-</dd>
                    </div>
                </dl>
            </section>
        </main>

        <div class="mp-actions">
            <a th:href="@{/auth/logout}" class="mp-btn mp-btn-logout" onclick="return logoutFromPopup(this)">로그아웃</a>
            <form th:action="@{/auth/withdraw}" method="post" class="mp-withdraw" onsubmit="return submitWithdrawalFromPopup(this)">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="mp-btn mp-btn-danger">회원 탈퇴</button>
            </form>
        </div>
    </article>
</div>

</body>
</html>
