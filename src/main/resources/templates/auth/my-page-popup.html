<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 | Forest Lium</title>
    <link rel="stylesheet" th:href="@{/css/auth/my-page.css}">
</head>
<body class="mp-page">
<div class="mp-shell">
    <article class="mp-card">
        <header class="mp-head">
            <div>
                <p class="mp-auth" th:text="${myPage.authType}">일반 로그인</p>
                <h1 class="mp-title">내 회원 정보</h1>
            </div>
            <button type="button" class="mp-close" onclick="window.close()" aria-label="닫기">×</button>
        </header>

        <main class="mp-content">
            <section class="mp-section">
                <h2 class="mp-section-title">기본 정보</h2>
                <dl class="mp-list">
                    <div class="mp-row">
                        <dt>이름</dt>
                        <dd th:text="${myPage.name ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>닉네임</dt>
                        <dd th:text="${myPage.nickname ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>이메일</dt>
                        <dd th:text="${myPage.email ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>전화번호</dt>
                        <dd th:text="${myPage.phoneNumber ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>소셜 플랫폼</dt>
                        <dd th:text="${myPage.socialPlatform ?: '-'}">-</dd>
                    </div>
                </dl>
            </section>

            <section class="mp-section">
                <h2 class="mp-section-title">세대 정보</h2>
                <dl class="mp-list">
                    <div class="mp-row">
                        <dt>주소</dt>
                        <dd th:text="${myPage.buildingName ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>동</dt>
                        <dd th:text="${myPage.dong ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>호</dt>
                        <dd th:text="${myPage.ho ?: '-'}">-</dd>
                    </div>
                    <div class="mp-row">
                        <dt>우편번호</dt>
                        <dd th:text="${myPage.postNum ?: '-'}">-</dd>
                    </div>
                </dl>
            </section>
        </main>

        <div class="mp-actions">
            <form th:action="@{/auth/logout}" method="post" th:data-home-url="@{/home}"
                  onsubmit="return logoutFromPopup(this)">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="mp-btn mp-btn-logout">로그아웃</button>
            </form>
            <form th:action="@{/auth/withdraw}" method="post" class="mp-withdraw"
                  onsubmit="return confirm('회원 탈퇴를 진행하시겠습니까? 탈퇴 후 계정 복구가 어렵습니다.')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="mp-btn mp-btn-danger">회원 탈퇴</button>
            </form>
        </div>
    </article>
</div>
<script>
    function logoutFromPopup(form) {
        var formData = new FormData(form);
        var homeUrl = form.dataset.homeUrl || '/home';

        fetch(form.action, {
            method: 'POST',
            body: formData,
            credentials: 'same-origin'
        }).finally(function () {
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = homeUrl;
            }
            window.close();
        });

        return false;
    }
</script>
</body>
</html>
