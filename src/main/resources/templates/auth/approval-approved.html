<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 완료 | Home Talk One Pass</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #eef7f1;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }
        .status-box {
            width: min(420px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #c8dfcf;
            border-radius: 8px;
            background: #fff;
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 24px; color: #1f7a3a; }
        p { margin: 0 0 24px; line-height: 1.6; color: #4b5563; }
        a {
            display: inline-grid;
            place-items: center;
            width: 100%;
            height: 44px;
            border-radius: 6px;
            background: #1f7a3a;
            color: #fff;
            font-size: 15px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main class="status-box">
    <h1>가입 승인이 완료되었습니다</h1>
    <p>이제 Home Talk One Pass 서비스를 이용할 수 있습니다.</p>
    <a th:href="@{/auth/login}}">시작하기</a>
</main>
</body>
</html>
