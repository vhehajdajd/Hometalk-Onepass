<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 거절 | Home Talk One Pass</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body class="auth-status-page auth-status-rejected">
<main class="auth-status-box">
    <h1 class="auth-title">가입 승인이 거절되었습니다</h1>
    <p>입력한 정보 확인이 필요합니다.<br>관리사무소에 문의해 주세요.</p>
    <form th:action="@{/auth/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="auth-btn auth-btn-block auth-btn-outline-danger" type="submit">로그아웃</button>
    </form>
</main>
</body>
</html>
