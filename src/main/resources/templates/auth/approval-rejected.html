<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 거절 | Home Talk One Pass</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f0f0;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }
        .status-box {
            width: min(420px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #e2c8c8;
            border-radius: 8px;
            background: #fff;
            text-align: center;
        }
        h1 { margin: 0 0 12px; font-size: 24px; color: #9f2a2a; }
        p { margin: 0 0 24px; line-height: 1.6; color: #4b5563; }
        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #9f2a2a;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main class="status-box">
    <h1>가입 승인이 거절되었습니다</h1>
    <p>입력한 정보 확인이 필요합니다.<br>관리사무소에 문의해 주세요.</p>
    <form th:action="@{/auth/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">로그아웃</button>
    </form>
</main>
</body>
</html>
