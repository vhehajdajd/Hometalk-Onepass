<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 : Hometop</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body class="auth-page auth-login-page">

<div class="auth-container">
    <!-- 일반 로그인과 소셜 로그인을 한 화면에 배치해 인증 진입점을 단순화한다. -->
    <img th:src="@{/auth/loginimage/logo.png}" alt="로그인 로고 이미지" class="auth-logo">

    <form th:action="@{/auth/login}" method="post" class="auth-form login-form">
        <div class="input-group">
            <input class="auth-input" type="text" name="loginId" placeholder="아이디를 입력하세요." required>
        </div>
        <div class="input-group">
            <input class="auth-input" type="password" name="password" placeholder="비밀번호를 입력하세요.">
        </div>
        <label class="remember-row">
            <input type="checkbox" name="remember-me" id="remember-me">
            <span>자동 로그인</span>
        </label>
        <button type="submit" class="auth-btn auth-btn-fixed">로그인</button>
    </form>

    <div>
        <p class="auth-note">계정이 없으신가요? <a class="auth-link" th:href="@{/auth/register}">회원가입</a></p>

        <hr class="auth-divider">

        <!-- 버튼은 Spring Security OAuth2 인가 엔드포인트로 직접 이동한다. -->
        <p class="auth-note">소셜 로그인</p>
        <div class="social-login-list">
            <div>
                <a th:href="@{/oauth2/authorization/kakao}" class="social-login-link">
                    <img th:src="@{/auth/loginimage/kakao_login.png}" alt="카카오 로그인">
                </a>
            </div>
            <div>
                <a th:href="@{/oauth2/authorization/naver}" class="social-login-link">
                    <img th:src="@{/auth/loginimage/naver_login.png}" alt="네이버 로그인">
                </a>
            </div>
            <div>
                <a th:href="@{/oauth2/authorization/google}" class="social-login-link">
                    <img th:src="@{/auth/loginimage/google_login.png}" alt="구글 로그인">
                </a>
            </div>
        </div>
    </div>

    <script th:if="${param.error}" th:inline="javascript">
        // error 쿼리스트링이 남아 있으면 새로고침 때 경고가 반복될 수 있어
        // 안내 후 현재 path 로 다시 이동해 URL 을 정리한다.
        alert("아이디 또는 비밀번호가 일치하지 않습니다.");
        window.location.href = window.location.pathname;
    </script>
    <script>
        document.querySelectorAll('.social-login-link').forEach(function (link) {
            link.addEventListener('click', function (event) {
                const rememberMe = document.getElementById('remember-me');
                if (!rememberMe || !rememberMe.checked) {
                    return;
                }

                event.preventDefault();
                const url = new URL(link.href, window.location.origin);
                url.searchParams.set('remember-me', 'on');
                window.location.href = url.toString();
            });
        });
    </script>
</div>

</body>
</html>
