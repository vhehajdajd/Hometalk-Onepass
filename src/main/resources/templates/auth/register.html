<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Home Talk One Pass</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body class="auth-page">

<div class="auth-container">
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-description">서비스 이용을 위해 추가 정보를 입력해주세요.</p>

    <!-- *{} = 객체를 전달받은 경우 매핑    -->
    <form class="auth-form" method="post" th:action="@{/auth/register/signup}" th:object="${signUpDTO}" onsubmit="return validateForm()">
        <input name="currentStep" th:value="${step}" type="hidden"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${step == 1}">
            <div class="input-group">
                <label for="email">이메일</label>
                <div class="email-check-row">
                    <input class="auth-input" placeholder="example@hometalk.com" required th:field="*{email}" type="email">
                    <button class="auth-btn" id="send-email-code-btn" type="button" onclick="sendEmailVerificationCode()">인증 발송</button>
                </div>
                <div class="email-check-row email-code-row">
                    <input class="auth-input" id="emailVerificationCode" inputmode="numeric" maxlength="6" placeholder="인증 코드 6자리" type="text">
                    <button class="auth-btn" type="button" onclick="verifyEmailCode()">인증 확인</button>
                </div>
                <p id="email-check-msg" class="auth-message auth-message-error"
                   th:text="${signupError}"></p>
                <input type="hidden" id="isEmailVerified" value="false">
            </div>

            <div class="input-group">
                <label for="loginId">아이디</label>
                <div class="id-check-row">
                    <input class="auth-input" placeholder="아이디를 입력하세요" required th:field="*{loginId}" type="text">
                    <button class="auth-btn" type="button" onclick="checkIdDuplicate()">중복 확인</button>
                </div>
                <p id="id-check-msg" class="auth-message auth-message-error"
                   th:text="${idError}"></p>
                <!-- 중복 확인 여부를 저장할 숨겨진 필드 (선택 사항: 가입 방지용) -->
                <input type="hidden" id="isIdChecked" value="false">
            </div>

            <div class="input-group">
                <label for="phoneNumber">연락처</label>
                <input class="auth-input" placeholder="휴대폰 번호(-)제외" required th:field="*{phoneNumber}" type="text">
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <input class="auth-input" id="pw1" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$" placeholder="비밀번호를 입력하세요" required th:field="*{password}"
                       title="8자 이상, 영문, 숫자, 특수문자를 포함해야 합니다."
                       type="password">
            </div>

            <div class="input-group">
                <label>비밀번호 확인</label>
                <input class="auth-input" type="password" id="pw2" placeholder="비밀번호 재입력">
                <p id="match-msg" class="auth-message"></p>
            </div>

            <div class="input-group">
                <label for="name">이름</label>
                <input class="auth-input" placeholder="이름을 입력하세요" required th:field="*{name}" type="text">
            </div>

            <div class="input-group">
                <label for="nickname">별명</label>
                <input class="auth-input" placeholder="별명을 입력해주세요" required th:field="*{nickname}" type="text">
            </div>

            <button class="auth-btn auth-btn-block" name="action" type="submit" value="next">다음</button>
        </div>

        <div th:if="${step == 2}">
            <input th:field="*{email}" type="hidden">
            <input th:field="*{loginId}" type="hidden">
            <input th:field="*{phoneNumber}" type="hidden">
            <input th:field="*{password}" type="hidden">
            <input th:field="*{name}" type="hidden">
            <input th:field="*{nickname}" type="hidden">

            <div class="input-group">
                <label for="postNum">주소</label>
                <div class="address-group">
                    <input class="auth-input" id="postNum" placeholder="우편 번호를 입력하세요" th:field="*{postNum}" type="text">
                    <button class="auth-btn" onclick="execDaumPostcode()" type="button">우편번호 찾기</button>
                </div>
            </div>


            <div class="input-group">
                <label for="buildingName"></label>
                <input class="auth-input" id="buildingName" placeholder="주소를 입력하세요" th:field="*{buildingName}" type="text">
            </div>

            <span class="address-detail">
                상세 주소
            </span>

            <div class="input-group">
                <label for="dong">동</label>
                <input class="auth-input" placeholder="동을 입력하세요 (ex 102동 -> 102)" th:field="*{dong}" type="text">
            </div>

            <div class="input-group">
                <label for="ho">호</label>
                <input class="auth-input" placeholder="호를 입력하세요 (ex 201호 -> 201)" th:field="*{ho}" type="text">
            </div>

            <div class="auth-row">
                <button class="auth-btn auth-btn-block" name="action" type="submit" value="prev">이전</button>
                <button class="auth-btn auth-btn-block" name="action" type="submit" value="complete">가입 완료</button>
            </div>
        </div>
    </form>
</div>

<script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:inline="javascript">

    // 1. 카카오 주소 API 관련 함수
    function execDaumPostcode() {
        new kakao.Postcode({
            oncomplete: function(data) {
                var addr = '';
                var extraAddr = '';

                if (data.userSelectedType === 'R') {
                    addr = data.roadAddress;
                } else {
                    addr = data.jibunAddress;
                }

                if(data.userSelectedType === 'R') {
                    if (data.bname !== '' && /[동로가]$/.test(data.bname)) {
                        extraAddr += data.bname;
                    }
                    if (data.buildingName !== '' && data.apartment === 'Y') {
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    if (extraAddr !== '') {
                        extraAddr = ' (' + extraAddr + ')';
                    }
                }

                document.getElementById('postNum').value = data.zonecode;
                document.getElementById('buildingName').value = addr + extraAddr;

                // 동 입력창 포커스 (id가 아닌 name으로 접근 시 주의)
                const dongInput = document.querySelector('input[name="dong"]');
                if(dongInput) dongInput.focus();
            }
        }).open();
    }

    // 2. 페이지 로드 시 이벤트 연결 (비밀번호 체크 및 아이디 리셋)
    window.addEventListener('DOMContentLoaded', function() {
        const pw1 = document.getElementById('pw1');
        const pw2 = document.getElementById('pw2');
        const msg = document.getElementById('match-msg');
        const loginIdInput = document.getElementById('loginId');
        const emailInput = document.getElementById('email');

        // 비밀번호 실시간 일치 확인
        if (pw1 && pw2 && msg) {
            const checkMatch = function() {
                const val1 = pw1.value;
                const val2 = pw2.value;

                if (val1 === "" || val2 === "") {
                    msg.textContent = "";
                    msg.className = "auth-message";
                } else if (val1 === val2) {
                    msg.textContent = "비밀번호가 일치합니다.";
                    msg.className = "auth-message auth-message-success";
                } else {
                    msg.textContent = "비밀번호가 일치하지 않습니다.";
                    msg.className = "auth-message auth-message-error";
                }
            };
            pw1.addEventListener('input', checkMatch);
            pw2.addEventListener('input', checkMatch);
        }

        // 아이디 입력값이 바뀌면 중복확인 상태 초기화
        if (loginIdInput) {
            loginIdInput.addEventListener('input', function() {
                const isCheckedInput = document.getElementById('isIdChecked');
                const idMsg = document.getElementById('id-check-msg');
                if (isCheckedInput) isCheckedInput.value = "false";
                if (idMsg) idMsg.innerText = "";
            });
        }

        if (emailInput) {
            emailInput.addEventListener('input', function() {
                const isEmailVerified = document.getElementById('isEmailVerified');
                const emailMsg = document.getElementById('email-check-msg');
                if (isEmailVerified) isEmailVerified.value = "false";
                if (emailMsg) {
                    emailMsg.innerText = "";
                    emailMsg.className = "auth-message";
                }
            });
        }
    });

    async function sendEmailVerificationCode() {
        const email = document.getElementById('email').value.trim();
        const msgElement = document.getElementById('email-check-msg');
        const isEmailVerified = document.getElementById('isEmailVerified');
        const sendEmailCodeUrl = /*[[@{/auth/register/email/send}]]*/ '/auth/register/email/send';

        if (!email) {
            alert("이메일을 입력해주세요.");
            return;
        }

        try {
            setEmailMessage("인증 코드를 발송 중입니다.", false);

            const response = await fetch(sendEmailCodeUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: new URLSearchParams({ email })
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "인증 코드 발송에 실패했습니다.");
            }

            if (isEmailVerified) isEmailVerified.value = "false";
            setEmailMessage(data.message, true);
        } catch (error) {
            console.error("Error:", error);
            if (isEmailVerified) isEmailVerified.value = "false";
            setEmailMessage(error.message, false);
        }
    }

    async function verifyEmailCode() {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('emailVerificationCode').value.trim();
        const isEmailVerified = document.getElementById('isEmailVerified');
        const verifyEmailCodeUrl = /*[[@{/auth/register/email/verify}]]*/ '/auth/register/email/verify';

        if (!email || !code) {
            alert("이메일과 인증 코드를 입력해주세요.");
            return;
        }

        try {
            const response = await fetch(verifyEmailCodeUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: new URLSearchParams({ email, code })
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "이메일 인증에 실패했습니다.");
            }

            isEmailVerified.value = "true";
            setEmailMessage(data.message, true);
        } catch (error) {
            console.error("Error:", error);
            isEmailVerified.value = "false";
            setEmailMessage(error.message, false);
        }
    }

    function setEmailMessage(message, success) {
        const msgElement = document.getElementById('email-check-msg');
        if (!msgElement) return;

        msgElement.innerText = message;
        msgElement.className = success
            ? "auth-message auth-message-success"
            : "auth-message auth-message-error";
    }

    // 3. 아이디 중복 확인 함수 (비동기)
    async function checkIdDuplicate() {
        const loginId = document.getElementById('loginId').value.trim();
        const msgElement = document.getElementById('id-check-msg');
        const isCheckedInput = document.getElementById('isIdChecked');
        const checkIdUrl = /*[[@{/auth/api/check-id-duplication}]]*/ '/auth/api/check-id-duplication';

        if (!loginId) {
            alert("아이디를 입력해주세요.");
            return;
        }

        try {
            // 타임리프의 @{}를 사용하여 서버 context-path 자동 반영
            const response = await fetch(`${checkIdUrl}?loginId=${encodeURIComponent(loginId)}`);

            if (!response.ok) {
                throw new Error("서버 응답 에러 (상태코드: " + response.status + ")");
            }

            const isDuplicate = await response.json(); // true: 중복, false: 사용가능

            if (isDuplicate) {
                msgElement.innerText = "이미 사용 중인 아이디입니다.";
                msgElement.className = "auth-message auth-message-error";
                isCheckedInput.value = "false";
            } else {
                msgElement.innerText = "사용 가능한 아이디입니다.";
                msgElement.className = "auth-message auth-message-success";
                isCheckedInput.value = "true";
            }
        } catch (error) {
            console.error("Error:", error);
            alert("중복 확인 중 오류가 발생했습니다. ");
        }
    }

    // 4. 폼 전송 전 전체 유효성 검사
    function validateForm() {
        const currentStepInput = document.querySelector('input[name="currentStep"]');
        if (!currentStepInput) return true;

        const currentStep = currentStepInput.value;

        if (currentStep === "1") {
            const isIdChecked = document.getElementById('isIdChecked').value;
            const isEmailVerified = document.getElementById('isEmailVerified').value;
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;

            if (isEmailVerified !== "true") {
                alert("이메일 인증을 완료해 주세요.");
                document.getElementById('email').focus();
                return false;
            }

            // 중복 확인 여부 체크
            if (isIdChecked !== "true") {
                alert("아이디 중복 확인을 완료해 주세요.");
                document.getElementById('loginId').focus();
                return false;
            }

            // 비밀번호 일치 여부 체크
            if (pw1 === "" || pw1 !== pw2) {
                alert("비밀번호가 일치하지 않거나 입력되지 않았습니다.");
                document.getElementById('pw2').focus();
                return false;
            }
        }
        return true;
    }
</script>
</body>
</html>
