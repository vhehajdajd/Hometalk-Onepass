<div class="container">
    <h1 class="module-title">전체 예약 현황 관리</h1>

    <div class="summary-card" style="padding: 0; overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
            </thead>
            <tbody>
            <tr th:each="res : ${reservations}" style="border-bottom: 1px solid var(--border-color);">
                <td th:text="${res.facilityName}">시설명</td>
                <td th:text="${res.userName}">예약자</td>
                <td th:text="${#temporals.format(res.startTime, 'MM/dd HH:mm') + ' ~ ' + #temporals.format(res.endTime, 'HH:mm')}">시간</td>
                <td>
                       <span class="status-badge"
                             th:classappend="${res.status.name() == 'CANCEL' ? 'status-canceled' : 'status-active'}"
                             th:text="${res.status.name() == 'CANCEL' ? '취소됨' : '예약완료'}">상태</span>
                </td>
                <td>
                    <button th:if="${res.status.name() != 'CANCEL'}"
                            type="button"
                            class="btn btn-point"
                            th:onclick="'confirmAdminCancel(' + ${res.id} + ')'"
                            style="padding: 5px 10px; font-size: 12px;">예약 취소</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservations)}">
                <td colspan="5" style="padding: 40px; text-align: center; color: #999;">현재 등록된 예약 내역이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/reservation/reservation.js}"></script>
