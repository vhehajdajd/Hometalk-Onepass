<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='예약 현황 관리')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout" sec:authorize="hasRole('ADMIN')">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='reservation')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'reservation'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: reservationAdmin}"></div>

        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">
            <div th:if="${message}" th:class="|alert-box ${status == 'success' ? 'alert-success' : 'alert-danger'}|">
                <div class="alert-content">
                    <i th:class="${status == 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'}"></i>
                    <span th:text="${message}">성공 메시지입니다.</span>
                </div>
                <button type="button" class="alert-close" onclick="this.parentElement.style.display='none';">&times;</button>
            </div>
            <main class="container">
                <div class="header-with-action flex-between mb-lg">
                    <!-- 왼쪽: 타이틀 -->
                    <div class="title-group">
                        <h1 class="module-title title">전체 예약 현황 관리</h1>
                    </div>

                    <!-- 오른쪽: 캘린더 보기 및 예약 신청 버튼 -->
                    <div class="action-wrapper flex gap-md">
                        <!-- 캘린더 이동 버튼 추가 -->
                        <a th:href="@{/reservation/calendar}" class="btn btn-outline">
                            <span style="margin-right: 8px;"><i class="fas fa-calendar-alt"> </i></span> 캘린더 현황 보기
                        </a>
                    </div>
                </div>

                <div class="res-dashboard-stats">
                    <div class="res-stat-card res-pending">
                        <div class="res-stat-info">
                            <span class="res-stat-label">승인 대기</span>
                            <div>
                                <span class="res-stat-value" th:text="${pendingCount}">0</span>
                                <span class="res-stat-unit">건</span>
                            </div>
                        </div>
                        <div class="res-stat-icon"><i class="fas fa-clock"></i></div>
                    </div>

                    <div class="res-stat-card res-active">
                        <div class="res-stat-info">
                            <span class="res-stat-label">현재 이용 중</span>
                            <div>
                                <span class="res-stat-value" th:text="${activeCount}">0</span>
                                <span class="res-stat-unit">건</span>
                            </div>
                        </div>
                        <div class="res-stat-icon"><i class="fas fa-running"></i></div>
                    </div>

                    <div class="res-stat-card res-total">
                        <div class="res-stat-info">
                            <span class="res-stat-label">오늘 전체 예약</span>
                            <div>
                                <span class="res-stat-value" th:text="${todayTotalCount}">0</span>
                                <span class="res-stat-unit">건</span>
                            </div>
                        </div>
                        <div class="res-stat-icon"><i class="fas fa-calendar-check"></i></div>
                    </div>
                </div>

                <div class="filter-section flex-between mb-md" style="align-items: center;">
                    <h3 class="m-0" style="font-size: 1.1rem; color: #444;">상세 내역</h3>

                    <form th:action="@{/reservation/admin/status}" method="get" id="filterForm">
                        <input type="hidden" name="page" value="0">

                        <select name="status" class="form-select" onchange="this.form.submit()">
                            <option value="">전체 상태 보기</option>
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s.title}"
                                    th:selected="${s == selectedStatus}">
                            </option>
                        </select>
                    </form>
                </div>

                <div class="summary-card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>시설명</th>
                                <th>예약자</th>
                                <th>예약 시간 / 신청일 / 취소일</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody th:if="${not #lists.isEmpty(reservations.content)}">
                            <tr th:each="res : ${reservations.content}">
                                <td th:text="${res.facilityName}">시설명</td>
                                <td th:text="${res.userName}">예약자</td>
                                <td>
                                    <div th:text="${#temporals.format(res.startTime, 'MM/dd HH:mm') + ' ~ ' + #temporals.format(res.endTime, 'HH:mm')}">시간</div>

                                    <div style="font-size: 0.75rem; color: #999;">
                                        <span th:if="${res.status?.toString() == 'CANCELED' and res.updatedAt != null}"
                                              th:text="|취소일: ${#temporals.format(res.updatedAt, 'MM/dd HH:mm')}|">
                                        </span>

                                        <span th:if="${res.status?.toString() != 'CANCELED' and res.createdAt != null}"
                                              th:text="|신청일: ${#temporals.format(res.createdAt, 'MM/dd HH:mm')}|">
                                        </span>
                                    </div>
                                </td>

                                <td th:id="|reservation-status-${res.id}|">
                                   <span class="status-badge"
                                         th:classappend="${
                                                res.status?.toString() == 'CANCELED' ? 'status-canceled' :
                                                (res.status?.toString() == 'REJECTED' ? 'status-rejected' :
                                                (res.status?.toString() == 'PENDING' ? 'status-pending' :
                                                (res.status?.toString() == 'FINISHED' ? 'status-finished' :
                                                'status-active')))
                                         }">

                                         <th:block th:if="${res.status?.toString() == 'CANCELED'}">취소</th:block>
                                         <th:block th:if="${res.status?.toString() == 'REJECTED'}">반려됨</th:block>
                                         <th:block th:if="${res.status?.toString() == 'PENDING'}">승인대기</th:block>
                                         <th:block th:if="${res.status?.toString() == 'FINISHED'}">이용종료</th:block>
                                         <th:block th:if="${res.status?.toString() == 'CONFIRMED'}">예약확정</th:block>
                                   </span>
                                </td>

<!--                            <td>
                                    <div class="flex-center gap-md" th:if="${res.status?.toString() == 'PENDING'}">
                                        <button type="button" class="btn btn-primary btn-sm"
                                                th:onclick="|approveReservation('${res.id}')|">
                                            승인
                                        </button>

                                        <button type="button" class="btn btn-point btn-sm"
                                                th:onclick="|rejectReservation('${res.id}')|">
                                            반려
                                        </button>
                                    </div>-->
                                <td th:id="|reservation-action-${res.id}|">
                                    <div th:if="${res.status?.toString() == 'PENDING'}"
                                         class="reservation-action-root"
                                         th:data-id="${res.id}">
                                    </div>
                                    <div th:if="${res.status?.toString() == 'REJECTED' and res.cancelReason != null}"
                                         style="color: #d9534f; margin-top: 2px;">
                                        <i class="fas fa-comment-dots"></i>
                                        사유: <span th:text="${res.cancelReason}">사유 내용</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <tbody th:if="${#lists.isEmpty(reservations.content)}">
                            <tr>
                                <td colspan="5" class="text-muted" style="padding: 60px 0;">현재 등록된 예약 내역이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="pagination-container"
                         th:if="${reservations.totalPages > 0}"
                         th:with="pageSize = 10,
                                  currentPage = ${reservations.number + 1},
                                  startPage = ${((currentPage - 1) / pageSize) * pageSize + 1},
                                  endPage = ${(reservations.totalPages == 0) ? 1 : (startPage + pageSize - 1 < reservations.totalPages ? startPage + pageSize - 1 : reservations.totalPages)}
                                 ">
                        <div class="left-wing"></div>

                        <nav aria-label="Page navigation" class="pagination-nav">
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${startPage <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/reservation/admin/status(page=${startPage - 2}, status=${selectedStatus != null ? selectedStatus : ''})}">&laquo;</a>
                                </li>
                                <li class="page-item"
                                    th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                                    th:classappend="${pageNumber == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/reservation/admin/status(page=${pageNumber - 1}, status=${selectedStatus != null ? selectedStatus : ''})}"
                                       th:text="${pageNumber}"></a>
                                </li>
                                <li class="page-item" th:classappend="${endPage >= reservations.totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/reservation/admin/status(page=${endPage}, status=${selectedStatus != null ? selectedStatus : ''})}">&raquo;</a>
                                </li>
                            </ul>
                        </nav>

                        <div class="action-wrapper">
                            <a th:href="@{/reservation/admin/facilities}" class="btn btn-primary">시설 등록</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div sec:authorize="!hasRole('ADMIN')" style="text-align: center; margin-top: 100px;">
    <h2>권한이 없습니다.</h2>
    <p>이 페이지는 관리자만 접근 가능합니다.</p>
    <a th:href="@{/}">홈으로 돌아가기</a>
</div>


<script th:src="@{/js/community/api.js}"></script>
<script defer th:src="@{/js/community/post-modal.js}"></script>

<!-- React Refresh -->
<script type="module">
    import RefreshRuntime from "http://localhost:8092/@react-refresh";
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => (type) => type;
    window.__vite_plugin_react_preamble_installed__ = true;
</script>
<!-- React mount -->
<script type="module"
        src="http://localhost:8092/src/features/reservation/mounts/reservation-action-main.jsx">
</script>

</body>
</html>
