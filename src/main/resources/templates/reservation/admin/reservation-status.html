<div class="container">
    <h1 class="module-title">전체 예약 현황 관리</h1>

    <div class="summary-card" style="padding: 0; overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
            <tr style="background-color: var(--color-modal-line); border-bottom: 1px solid var(--border-color); text-align: left;">
                <th style="padding: 15px;">시설명</th>
                <th style="padding: 15px;">예약자</th>
                <th style="padding: 15px;">이용 시간</th>
                <th style="padding: 15px;">상태</th>
                <th style="padding: 15px;">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="res : ${reservations}" style="border-bottom: 1px solid var(--border-color);">
                <td style="padding: 15px; font-weight: 600; color: var(--color-main);" th:text="${res.facilityName}">테니스장</td>
                <td style="padding: 15px;" th:text="${res.userName}">김지현</td>
                <td style="padding: 15px;" th:text="${#temporals.format(res.startTime, 'MM/dd HH:mm') + ' ~ ' + #temporals.format(res.endTime, 'HH:mm')}">04/29 09:00 ~ 10:00</td>
                <td style="padding: 15px;">
                   <span class="status-badge"
                         th:classappend="${res.status.name() == 'CANCEL' ? 'status-canceled' : 'status-active'}"
                         th:text="${res.status.name() == 'CANCEL' ? '취소됨' : '예약완료'}">정상</span>
                </td>
                <td style="padding: 15px;">
                    <form th:if="${res.status.name() != 'CANCEL'}" th:action="@{/api/reservations/{id}/cancel(id=${res.id})}" method="post">
                        <button type="submit" class="btn btn-point" style="padding: 5px 10px; font-size: 12px;">강제취소</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservations)}">
                <td colspan="5" style="padding: 40px; text-align: center; color: #999;">
                    현재 등록된 예약 내역이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
