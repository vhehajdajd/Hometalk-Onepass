<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='시설 관리')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='reservation')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'reservation'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: reservation}"></div>

        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">

            <main class="container">
                <h1 class="module-title">시설 설정 및 관리</h1>

                <section class="summary-card" style="margin-bottom: 40px;">
                    <label class="label-text">신규 시설 등록</label>
                    <form th:action="@{/reservation/admin/facilities/register}" method="post" enctype="multipart/form-data">

                        <div class="row-group">
                            <div style="flex: 2;">
                                <label class="label-text" style="font-size: 14px;">시설 명칭</label>
                                <input type="text" name="name" class="input-field" placeholder="예: 테니스장 A코트" required>
                            </div>
                            <div style="flex: 1;">
                                <label class="label-text" style="font-size: 14px;">대표 아이콘</label>
                                <select class="input-field" name="iconType">
                                    <option value="DUMBBELL">🏋️ 헬스/운동</option>
                                    <option value="BOOK">📖 공부/도서</option>
                                    <option value="TENNIS">🎾 스포츠/테니스</option>
                                    <option value="HOUSE">🏠 숙박/게스트</option>
                                    <option value="COFFEE">☕ 커뮤니티/카페</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label class="label-text" style="font-size: 14px;">시설 대표 사진</label>
                            <input type="file" name="imageFile" class="input-field" accept="image/*">
                            <p class="helper-text">※ 1:1 비율의 깔끔한 사진을 권장합니다.</p>
                        </div>

                        <div class="row-group">
                            <div class="col-half">
                                <label class="label-text" style="font-size: 14px;">운영 시작</label>
                                <select class="input-field" name="openTime">
                                    <option th:each="hour : ${#numbers.sequence(0, 23)}"
                                            th:value="${#numbers.formatInteger(hour, 2) + ':00'}"
                                            th:text="${#numbers.formatInteger(hour, 2) + ':00'}"></option>
                                </select>
                            </div>
                            <div class="col-half">
                                <label class="label-text" style="font-size: 14px;">운영 종료</label>
                                <select class="input-field" name="closeTime">
                                    <option th:each="hour : ${#numbers.sequence(0, 23)}"
                                            th:value="${#numbers.formatInteger(hour, 2) + ':00'}"
                                            th:text="${#numbers.formatInteger(hour, 2) + ':00'}"></option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-main" style="width: 100%;">새 시설 등록하기</button>
                    </form>
                </section>

                <section>
                    <label class="label-text">등록된 시설 목록 (<span th:text="${facilities.size()}">0</span>)</label>
                    <div class="facility-list">
                        <div th:if="${facilities.isEmpty()}" class="summary-card" style="text-align: center; color: var(--color-text-muted);">
                            등록된 시설이 없습니다. 상단에서 새로 등록해주세요.
                        </div>

                        <div th:each="f : ${facilities}" class="summary-card" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; padding: 20px;">
                            <div>
                                <div style="font-size: 18px; font-weight: 600; color: var(--color-main);" th:text="${f.name}">테니스장 A코트</div>
                                <div style="font-size: 14px; color: var(--color-text-muted); margin-top: 4px;">
                                    운영 시간: <span th:text="${f.openTime}">09:00</span> ~ <span th:text="${f.closeTime}">22:00</span>
                                </div>
                            </div>
                            <form th:action="@{/reservation/admin/facilities/{id}/delete(id=${f.id})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-point" style="padding: 8px 16px; font-size: 14px; margin: 0;">삭제</button>
                            </form>
                        </div>
                    </div>
                </section>

                <div class="btn-group">
                    <a href="/admin/dashboard" class="btn" style="background-color: var(--color-bg-white-btn); color: var(--color-main); text-decoration: none;">관리자 대시보드로 돌아가기</a>
                </div>
            </main>
        </div>
    </div>
</div>

</body>
</html>
