<!DOCTYPE html>
<html lang="ko"  xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='내 예약 현황')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='reservation')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'reservation'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: reservation}"></div>

        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">
            <main class="container">
                <div class="header-with-action flex-between mb-lg">
                    <h1 class="title">나의 예약 현황</h1>

                    <div class="action-wrapper">
                        <a th:href="@{/reservation/calendar}" class="btn btn-outline flex gap-md">
                            <span style="margin-right: 8px;"><i class="fas fa-calendar-alt"> </i></span> 캘린더 현황 보기
                        </a>
                    </div>
                </div>

                <div class="summary-card" style="padding: 0; overflow-x: auto;" th:if="${not #lists.isEmpty(reservations)}">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>이용 시설</th>
                                <th>이용 일시</th>
                                <th>상태</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="res : ${reservations}"
                                style="border-bottom: 1px solid var(--border-color);"
                                th:with="now=${T(java.time.LocalDateTime).now()}">
                                <td style="padding: 15px; font-weight: 600; color: var(--color-main);" th:text="${res.facilityName}">테니스장</td>
                                <td lass="text-muted" th:text="${#temporals.format(res.startTime, 'MM/dd HH:mm') + ' ~ ' + #temporals.format(res.endTime, 'HH:mm')}">04/29 09:00 ~ 10:00</td>
                                <td>
                                    <span class="status-badge"
                                          th:classappend="${res.status?.toString() == 'CANCELED' ? 'status-canceled' :
                                                         (res.status?.toString() == 'PENDING' ? 'status-pending' :
                                                         (res.status?.toString() == 'FINISHED' ? 'status-finished' : 'status-active'))}">

                                        <th:block th:if="${res.status?.toString() == 'CANCELED'}">취소됨</th:block>
                                        <th:block th:if="${res.status?.toString() == 'PENDING'}">승인대기</th:block>
                                        <th:block th:if="${res.status?.toString() == 'FINISHED'}">이용종료</th:block>
                                        <th:block th:if="${res.status?.toString() == 'CONFIRMED'}">예약확정</th:block>
                                    </span>
                                </td>
                                <td>
                                    <button th:if="${res.status?.toString() == 'CONFIRMED'
                                                   && (now.isAfter(res.startTime) || now.isEqual(res.startTime))
                                                   && now.isBefore(res.endTime)}"
                                            class="btn btn-primary btn-sm"
                                            th:onclick="|finishUsage('${res.id}')|">
                                        이용 종료
                                    </button>

                                    <button th:if="${res.status?.toString() == 'PENDING' || (res.status?.toString() == 'CONFIRMED' && now.isBefore(res.startTime))}"
                                            class="btn btn-outline-danger btn-sm"
                                            th:onclick="|confirmCancel('${res.id}')|">
                                        예약 취소
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="summary-card" th:if="${#lists.isEmpty(reservations)}">
                    <div class="flex-center flex-direction-column" style="padding: 60px 0;">
                        <p class="text-muted mb-md">아직 예약한 내역이 없습니다.</p>
                        <a th:href="@{/reservation/apply}" class="btn btn-primary">시설 예약하러 가기</a>
                    </div>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<script th:src="@{/js/reservation/reservation.js}"></script>
</body>
</html>
