<!DOCTYPE html>
<html lang="ko"  xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='내 예약 현황')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>
<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='reservation')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'reservation'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: reservation}"></div>

        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">
            <main class="container">
                <div th:if="${message}" th:class="|alert-box ${status == 'success' ? 'alert-success' : 'alert-danger'}|">
                    <div class="alert-content">
                        <i th:class="${status == 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'}"></i>
                        <span th:text="${message}">성공 메시지입니다.</span>
                    </div>
                    <button type="button" class="alert-close" onclick="this.parentElement.style.display='none';">&times;</button>
                </div>

                <div class="header-with-action flex-between mb-lg">
                    <h1 class="title">나의 예약 현황</h1>

                    <div class="action-wrapper">
                        <a th:href="@{/reservation/calendar}" class="btn btn-outline flex gap-md">
                            <span style="margin-right: 8px;"><i class="fas fa-calendar-alt"> </i></span> 캘린더 현황 보기
                        </a>
                    </div>
                </div>

                <div class="filter-and-sort-section mb-md" style="display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 0;">

                    <div class="sort-tabs" style="display: flex; gap: 8px;">
                        <a th:href="@{/reservation/my(page=0, sortBy='regDate', status=${selectedStatus})}"
                           th:classappend="${currentSort == 'regDate' ? 'active' : ''}" class="sort-tab-btn">
                            <i class="fas fa-history" style="font-size: 12px; margin-right: 4px;"></i> 예약 신청일순
                        </a>
                        <a th:href="@{/reservation/my(page=0, sortBy='resDate', status=${selectedStatus})}"
                           th:classappend="${currentSort == 'resDate' ? 'active' : ''}" class="sort-tab-btn">
                            <i class="fas fa-calendar-alt" style="font-size: 12px; margin-right: 4px;"></i> 예약 예정일순
                        </a>
                    </div>

                    <form th:action="@{/reservation/my}" method="get" id="filterForm">
                        <input type="hidden" name="page" value="0">
                        <input type="hidden" name="sortBy" th:value="${currentSort}">

                        <select name="status" class="form-select" onchange="this.form.submit()"
                                style="padding: 6px 12px; border-radius: 8px; border: 1px solid #ddd; outline: none; cursor: pointer; font-size: 14px; color: #444;">
                            <option value="">전체 상태</option>
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s.title}"
                                    th:selected="${s == selectedStatus}">
                            </option>
                        </select>
                    </form>
                </div>

                <div class="summary-card" style="padding: 0; overflow-x: auto;" th:if="${not reservations.empty}">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>이용 시설</th>
                                <th>이용 일시</th>
                                <th>상태</th>
                                <th>비고</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="res : ${reservations}"
                                style="border-bottom: 1px solid var(--border-color);"
                                th:classappend="${res.endTime != null && res.endTime.isBefore(T(java.time.LocalDateTime).now())} ? 'past-reservation' : ''"
                                th:with="now=${T(java.time.LocalDateTime).now()}">
                                <td style="padding: 15px; font-weight: 600; color: var(--color-main);" th:text="${res.facilityName}">테니스장</td>
                                <td lass="text-muted" th:text="${#temporals.format(res.startTime, 'MM/dd HH:mm') + ' ~ ' + #temporals.format(res.endTime, 'HH:mm')}">04/29 09:00 ~ 10:00</td>
                                <td>
                                    <span class="status-badge"
                                          th:classappend="${res.status?.toString() == 'CANCELED' ? 'status-canceled' :
                                                         (res.status?.toString() == 'PENDING' ? 'status-pending' :
                                                         (res.status?.toString() == 'FINISHED' ? 'status-finished' : 'status-active'))}">

                                        <th:block th:if="${res.status?.toString() == 'CANCELED'}">취소됨</th:block>
                                        <th:block th:if="${res.status?.toString() == 'PENDING'}">승인대기</th:block>
                                        <th:block th:if="${res.status?.toString() == 'FINISHED'}">이용종료</th:block>
                                        <th:block th:if="${res.status?.toString() == 'CONFIRMED'}">예약확정</th:block>
                                    </span>
                                </td>
                                <td>
                                    <!-- 예약 상태가 CANCELED일 때만 노출 -->
                                    <div th:if="${res.status.toString() == 'CANCELED' && res.cancelReason != null}"
                                         class="reject-reason-box"
                                         style="margin-bottom: 8px;">
                                        <p style="color: #d9534f; display: block;">
                                            <i class="fas fa-exclamation-circle"></i>
                                            <strong>반려 사유:</strong> [[${res.cancelReason}]]
                                        </p>
                                    </div>
                                    <button th:if="${res.status?.toString() == 'CONFIRMED'
                                                   && (now.isAfter(res.startTime) || now.isEqual(res.startTime))
                                                   && now.isBefore(res.endTime)}"
                                            class="btn btn-primary btn-sm"
                                            th:onclick="|finishUsage(event, '${res.id}')|">
                                        이용 종료
                                    </button>

                                    <button th:if="${res.status?.toString() == 'PENDING' || (res.status?.toString() == 'CONFIRMED'
                                                   && now.isBefore(res.startTime.minusHours(1)))}"
                                            class="btn btn-outline-danger btn-sm"
                                            th:onclick="|confirmCancel('${res.id}')|">
                                        예약 취소
                                    </button>

                                    <span th:if="${res.status?.toString() == 'CONFIRMED'
                                                   && now.isAfter(res.startTime.minusHours(1))
                                                   && now.isBefore(res.startTime)}"
                                          class="text-muted text-small">
                                        취소 불가(임박)
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="pagination-container"
                         th:if="${reservations.totalPages > 0}"
                         th:with="pageSize = 10,
                                  currentPage = ${reservations.number + 1},
                                  startPage = ${((currentPage - 1) / pageSize) * pageSize + 1},
                                  endPage = ${(reservations.totalPages == 0) ? 1 : (startPage + pageSize - 1 < reservations.totalPages ? startPage + pageSize - 1 : reservations.totalPages)}
                                 ">
                        <div class="left-wing"></div>

                        <nav aria-label="Page navigation" class="pagination-nav">
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${startPage <= 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/reservation/my(page=${startPage - 2}, sortBy=${currentSort}, status=${selectedStatus})}" aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>

                                <li class="page-item"
                                    th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                                    th:classappend="${pageNumber == currentPage} ? 'active'">
                                    <a class="page-link" th:href="@{/reservation/my(page=${pageNumber - 1}, sortBy=${currentSort}, status=${selectedStatus})}" th:text="${pageNumber}"></a>
                                </li>

                                <li class="page-item" th:classappend="${endPage >= reservations.totalPages} ? 'disabled'">
                                    <a class="page-link" th:href="@{/reservation/my(page=${endPage}, sortBy=${currentSort}, status=${selectedStatus})}" aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                        <div class="action-wrapper">
                            <a th:href="@{/reservation/apply}" class="btn btn-primary">시설 예약</a>
                        </div>
                    </div>
                </div>

                <div class="summary-card" th:if="${reservations.empty}">
                    <div class="flex-center flex-direction-column" style="padding: 100px 0; gap: 20px;">
                        <p class="text-muted" style="margin: 0; font-size: 1.1rem;">아직 예약한 내역이 없습니다.</p>
                        <a th:href="@{/reservation/apply}" class="btn btn-primary" style="width: fit-content;">
                            시설 예약하러 가기
                        </a>
                    </div>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<script th:inline="javascript">
    const CSRF_TOKEN = document.querySelector('meta[name="_csrf"]')?.content;
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]')?.content;

    function getCsrfHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        if (CSRF_HEADER && CSRF_TOKEN) {
            headers[CSRF_HEADER] = CSRF_TOKEN;
        }
        return headers;
    }

    // 1. [사용자] 이용 종료
    async function finishUsage(event, id) {
        const btn = event.currentTarget || event.target;

        if (!confirm("지금 이용을 종료하시겠습니까?\n종료 시 남은 시간은 다른 분들이 예약할 수 있도록 개방됩니다.")) {
            return;
        }

        try {
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerText = "처리 중...";

            const response = await fetch(`/hometop/api/reservations/${id}/finish`, {
                method: 'PATCH',
                headers: getCsrfHeaders()
            });

            if (response.ok) {
                showNotice("이용 종료 처리가 완료되었습니다.", "success");
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                const errorText = await response.text();
                showNotice(errorText || "이용 종료 처리 중 오류가 발생했습니다.", "error");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        } catch (error) {
            console.error("Error:", error);
            showNotice("서버와 통신 중 오류가 발생했습니다.", "error");
            btn.disabled = false;
            if(typeof originalText !== 'undefined') btn.innerText = originalText;
        }
    }

    // 2. [사용자] 예약 취소
    async function confirmCancel(id) {
        const ok = confirm("예약을 취소하시겠습니까?");
        if (!ok) return;

        try {
            const response = await fetch(`/hometop/api/reservations/${id}/cancel`, {
                method: 'PATCH',
                headers: getCsrfHeaders(),
                body: JSON.stringify({
                    reason: null // 유저가 직접 취소할 때는 사유가 null
                })
            });
            if (response.ok) {
                showNotice("예약이 취소되었습니다.", "success");
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                const errorMsg = await response.text();
                showNotice("실패: " + (errorMsg || response.status), "error");
            }
        } catch (error) {
            console.error(error);
            showNotice("서버 통신 중 오류가 발생했습니다.", "error");
        }
    }

    // 3. 알림 메시지 띄우기용 함수
    function showNotice(message, type = 'success') {
        const existingBox = document.querySelector('.alert-box');
        if (existingBox) existingBox.remove();

        const alertBox = document.createElement('div');
        alertBox.className = `alert-box ${type === 'success' ? 'alert-success' : 'alert-danger'}`;

        alertBox.innerHTML = `
            <div class="alert-content">
                <i class="${type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'}"></i>
                <span>${message}</span>
            </div>
            <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
        `;

        const container = document.querySelector('.container');
        if (container) {
            container.prepend(alertBox);
        } else {
            alert(message); // 안전장치용
        }

        setTimeout(() => {
            if (alertBox) alertBox.style.opacity = '0';
            setTimeout(() => alertBox.remove(), 500);
        }, 3000);
    }
</script>
</body>
</html>
