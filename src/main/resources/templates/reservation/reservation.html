<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='시설 예약')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div class="main-layout">
  <div th:replace="~{fragments/sidebar :: sidebar(currentPage='reservation')}"></div>
  <div class="main-wrapper">
    <!-- 상단 메뉴 -->
    <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'reservation'} })}"></div>
    <div th:replace="~{fragments/headerCategoryMenu :: reservation}"></div>

    <!-- 메인 콘텐츠 -->
    <div class="dashboard-content">

      <main class="container">

        <h1 class="title">시설 예약</h1>

        <form id="reservationForm">
          <input type="hidden" id="hidden-facility" name="facilityName">
          <input type="hidden" id="hidden-date" name="reservationDate">
          <input type="hidden" id="selected-facility-usage-time" value="1">
          <input type="hidden" id="hidden-facility-id" name="facilityId">

          <div id="step1" class="step-section active">
            <label class="form-label mb-md">1. 시설을 선택해주세요</label>
            <div class="facility-list">
              <!-- DB의 facilities 목록을 반복해서 출력 -->
              <div th:each="f : ${facilities}"
                   class="facility-item card-hover"
                   th:data-name="${f.name}"
                   th:data-id="${f.id}"
                   th:data-max-time="${f.maxReservationTime}"
                   th:data-max-capacity="${f.maxCapacity}"
                   onclick="handleFacilityClick(this)"> <!-- 함수 호출 방식을 변경 -->

                <strong th:text="${f.name}">시설명</strong>
                <p class="capacity-info" style="font-size: 12px; color: var(--color-main);">
                  <i class="fas fa-users"></i> 총 정원: <span th:text="${f.maxCapacity}">0</span>명
                </p>
                <p class="time-info" style="font-size: 12px; color: gray;">
                  운영: <span th:text="${f.operationTime?.formattedOpenTime}">09:00</span>
                  ~ <span th:text="${f.operationTime?.formattedCloseTime}">22:00</span>
                </p>
                <span class="badge" th:text="|(${f.maxReservationTime}시간 단위)|">(1시간 단위)</span>
              </div>

              <!-- 등록된 시설이 없을 때 메시지 -->
              <div th:if="${#lists.isEmpty(facilities)}" class="text-center text-muted py-xl">
                현재 예약 가능한 시설이 없습니다.
              </div>
            </div>
          </div>

          <div id="step2" class="step-section">
            <label class="form-label mb-md">2. 날짜를 선택해주세요 (<span id="selected-facility-name" style="color:var(--color-btn-point)"></span>)</label>
            <div class="summary-card">
              <div class="date-input-wrapper">
                <input type="text"
                       id="resDate"
                       class="input-field"
                       placeholder="연도-월-일 선택">

                <i class="fas fa-calendar-alt calendar-icon"></i>
              </div>
            </div>
            <div class="btn-group bg-light">
              <button type="button" class="btn btn-outline" onclick="prevStep(1)">이전으로</button>
            </div>
          </div>

          <div id="step3" class="step-section">
            <label class="form-label mb-md">3. 예약 시간 및 상세 확인</label>
            <div class="info-guide-box mt-md">
              <p class="guide-text">
                <i class="fas fa-info-circle"></i>
                <strong>예약 방법:</strong> 원하시는 시간대의 <strong>시작 시간</strong>과 <strong>종료 시간</strong>을 각각 클릭해 주세요.
                (자동으로 사이 시간까지 선택됩니다.)
              </p>
            </div>
            <div class="summary-card">
              <div class="admin-answer-section text-center mb-lg">
                <span id="display-date-text" class="text-muted">날짜 선택 전</span>
                <div class="mt-sm" style="font-size: 24px; font-weight:700; color: var(--color-main);">
                  <span id="display-time">00:00</span> <span style="font-weight:400; font-size:18px;"></span> → <span id="end-time">00:00</span>
                </div>
              </div>
              <div class="time-grid mt-lg">
                <th:block th:each="hour : ${#numbers.sequence(9, 21)}">
                  <label class="time-chip-label time-chip-wrapper"
                         th:data-hour="${hour}"
                         onclick="handleTimeClick(this)">
                    <div class="time-chip" th:text="${#numbers.formatInteger(hour, 2) + ':00'}">00:00</div>
                    <small class="capacity-status" th:id="|cap-${hour}|">
                      <i class="fas fa-user-friends" style="font-size: 10px;"></i>
                      <span class="count-text">조회 중...</span>
                    </small>
                  </label>
                </th:block>
              </div>
              <div class="btn-area flex-center gap-md mt-xl">
                <button type="button" class="btn btn-outline"
                        onclick="document.getElementById('resDate').value=''; prevStep(2);">이전</button>
                <button type="button" class="btn btn-primary" onclick="submitReservation()">최종 예약 신청</button>
              </div>
            </div>
          </div>
        </form>
      </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
<script th:src="@{/js/reservation/reservation.js}"></script>

</body>
</html>
