<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{inquiry/fragments/head :: inqHead(pageTitle='전체 예약 현황')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/calendar.css}">
</head>
<body>

<div class="main-layout">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='reservation')}"></div>
    <div class="main-wrapper">
        <!-- 상단 메뉴 -->
        <div th:replace="~{fragments/headerCurrentMenuView :: path(paths=${ {'reservation'} })}"></div>
        <div th:replace="~{fragments/headerCategoryMenu :: reservation}"></div>

        <!-- 메인 콘텐츠 -->
        <div class="dashboard-content">
            <main class="container">
                <div class="header-with-action">
                    <!-- 왼쪽: 타이틀과 시설 버튼들 -->
                    <div class="title-group">
                        <h1 class="module-title title">전체 예약 현황</h1>
                        <div id="facilityButtons" class="facility-tabs"></div>
                    </div>

                    <!-- 오른쪽: 예약 신청하기 버튼 -->
                    <div class="action-wrapper"> <!-- 기존 .action-wrapper 활용 -->
                        <a th:href="@{/reservation/apply}" class="btn btn-primary btn-apply-lg">
                            + 예약 신청
                        </a>
                    </div>
                </div>

                <!-- 2. 캘린더가 그려질 핵심 영역 -->
                <div id="calendar-container">
                    <div id="calendar"></div>
                </div>
            </main>
        </div>
    </div>
</div>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script th:src="@{/js/reservation/calendar.js}"></script>
</body>
</html>
