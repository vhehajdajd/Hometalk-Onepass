<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="path(paths)" class="header">
    <span th:text="${paths != null and !#strings.toString(paths).isEmpty() ?
        (#strings.toString(paths).contains('notice') ? '공지사항' :
        #strings.toString(paths).contains('schedule') ? '일정' :
        #strings.toString(paths).contains('inquiry') ? '문의' :
        #strings.toString(paths).contains('reservation') ? '예약' :
        #strings.toString(paths).contains('parking') ? '주차' :
        #strings.toString(paths).contains('billing') ? '관리비' :
        #strings.toString(paths).contains('community') ? '커뮤니티' :
        #strings.toString(paths).contains('myPage') ? '마이페이지' :
        #strings.toString(paths).contains('home') ? '대시보드' : '홈') : '홈'}">홈</span>

    <div style="display:flex; align-items:center; gap:20px; margin-left:auto;">
        <!-- 변경: 기존 SVG를 그대로 사용하되 ID와 뱃지 추가 -->
        <div class="noti-bell-wrap" style="position: relative; display: inline-block;">
            <a href="javascript:void(0)" class="noti-bell" id="noti-bell-trigger"
               style="display:flex; align-items:center; color:var(--color-main); text-decoration:none;">
                <!-- 기존 SVG 디자인 그대로 유지 -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
                <!-- 실시간 알림 뱃지 (CSS에서 위치 잡음) -->
                <span class="noti-bell__badge" id="noti-bell-badge"></span>
            </a>

            <!-- 알림 드롭다운 (JS가 렌더링) -->
            <div class="noti-dropdown" id="noti-dropdown">
                <div class="noti-dropdown__header">
                    <span class="noti-dropdown__title">알림</span>
                    <button class="noti-dropdown__action" id="noti-mark-all">전체 읽음</button>
                </div>
                <div class="noti-dropdown__body" id="noti-dropdown-body">
                    <div class="noti-loading">불러오는 중...</div>
                </div>
                <div class="noti-dropdown__footer">
                    <button class="noti-dropdown__more" id="noti-load-more">더보기</button>
                </div>
            </div>
        </div>


        <a th:href="@{/myPage}" style="display:flex; align-items:center; gap:6px; color:var(--color-main); text-decoration:none; font-size:14px; font-weight:600;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M20 21a8 8 0 1 0-16 0"/>
            </svg>
            MyPage
        </a>
    </div>
</div>

</body>
</html>
