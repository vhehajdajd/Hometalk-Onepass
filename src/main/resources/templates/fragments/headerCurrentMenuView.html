<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="path(paths)" class="header">
    <!-- ── 현재 페이지명 ── -->
    <span th:text="${#strings.toString(paths).contains('notice') ? '공지사항' :
        #strings.toString(paths).contains('schedule') ? '일정' :
        #strings.toString(paths).contains('inquiry') ? '문의' :
        #strings.toString(paths).contains('reservation') ? '예약' :
        #strings.toString(paths).contains('parking') ? '주차' :
        #strings.toString(paths).contains('billing') ? '관리비' :
        #strings.toString(paths).contains('community') ? '커뮤니티' :
        #strings.toString(paths).contains('myPage') ? '마이페이지' :
        #strings.toString(paths).contains('home') ? '대시보드' :
        #strings.toString(paths).contains('approvals') ? '회원 승인' :
        #strings.toString(paths).contains('notification') ? '알림' : '홈'}">홈</span>

    <!-- ── 우측 아이콘 ── -->
    <div style="    display:flex; align-items:center; gap:20px; margin-left:auto;">
        <!-- ✅ 수정 — notification-bell.js가 요구하는 마크업으로 교체 -->
        <div class="noti-bell-wrap" style="position:relative">
            <a class="noti-bell" id="noti-bell-trigger" style="display:flex; align-items:center; color:var(--color-main); text-decoration:none; cursor:pointer;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                </svg>
                <span class="noti-bell__badge" id="noti-bell-badge" style="display:none;"></span>
            </a>
            <div class="noti-dropdown" id="noti-dropdown">
                <div class="noti-dropdown__header">
                    <span class="noti-dropdown__title">알림</span>
                    <button class="noti-dropdown__action" id="noti-mark-all">전체 읽음</button>
                </div>
                <div class="noti-dropdown__body" id="noti-dropdown-body">
                    <div class="noti-loading">불러오는 중...</div>
                </div>
                <div class="noti-dropdown__footer">
                    <button class="noti-dropdown__more" id="noti-load-more">더보기</button>
                </div>
            </div>
        </div>
        <!-- 마이페이지 -->
        <a th:href="@{/myPage/popup}"
           target="myPagePopup"
           onclick="window.open(this.href, 'myPagePopup', 'width=520,height=760,scrollbars=yes,resizable=yes'); return false;"
           style="display:flex; align-items:center; gap:6px; color:var(--color-main); text-decoration:none; font-size:14px; font-weight:600;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M20 21a8 8 0 1 0-16 0"/>
            </svg>
            MyPage
        </a>
    </div>
</div>

</body>
</html>
